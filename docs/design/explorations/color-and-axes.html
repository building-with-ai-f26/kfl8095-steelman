<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Color and axes</title>
<!--
  A mock-up for review only (Nov 26, 2026): color in a person's first visit, and options for the
  importance and articulation axes. Ideas 1, 4, 5, and 8 from style-ideas.html are the base.
  It reads the real tokens from ../tokens.css; the screens are simplified copies, not the app.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #f4f4f3; color: var(--sm-ink); font: 400 14px/1.45 var(--sm-sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  /* Idea 9 wasn't chosen, so the serif stays on the text cut, as in the app today. */
  .serif { font-family: var(--sm-serif); font-variation-settings: "opsz" 20; }

  /* Top bar and controls (as on style-ideas.html) */
  .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 20px; background: var(--sm-card); border-bottom: 1px solid var(--sm-line); }
  .brand { display: flex; align-items: center; gap: 8px; font: 600 23px/1 var(--sm-serif); }
  .brand img { width: 26px; height: 26px; }
  .crumb { font: 500 11px/1 var(--sm-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--sm-muted); padding: 5px 8px; border: 1px solid var(--sm-line); border-radius: 6px; }
  .grow { flex: 1; }
  .seg { display: inline-flex; padding: 2px; border: 1px solid var(--sm-line); border-radius: 8px; background: var(--sm-card); }
  .seg button { border: 0; background: transparent; padding: 0 12px; height: 28px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: background var(--sm-fast) var(--sm-ease), color var(--sm-fast) var(--sm-ease); }
  .seg button:hover { background: var(--sm-soft); }
  .seg button[aria-pressed="true"] { background: var(--sm-selected); color: var(--sm-on-selected); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--sm-line); background: var(--sm-card); font-size: 13px; cursor: pointer; transition: background var(--sm-fast) var(--sm-ease); user-select: none; -webkit-user-select: none; }
  .btn:hover { background: var(--sm-soft); }
  .btn.small { height: 28px; font-size: 12px; padding: 0 10px; }
  #compare[aria-pressed="true"] { background: var(--sm-ink); color: #fff; border-color: var(--sm-ink); }

  .layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); }
  .controls { position: sticky; top: 56px; align-self: start; height: calc(100vh - 56px); overflow: auto; padding: 20px 18px 32px; background: var(--sm-card); border-right: 1px solid var(--sm-line); }
  .controls h1 { font: 600 20px/1.25 var(--sm-serif); margin: 0 0 6px; }
  .lede { margin: 0 0 6px; color: var(--sm-muted); font-size: 13px; }
  .gl { font: 500 11px/1 var(--sm-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--sm-muted); margin: 20px 0 8px; }
  .idea { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; padding: 10px; margin: 0 -10px; border-radius: 10px; cursor: pointer; transition: background var(--sm-fast) var(--sm-ease); }
  .idea:hover { background: #f4f3f1; }
  .idea input { margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--sm-ink); cursor: pointer; }
  .idea .t { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-weight: 600; font-size: 13px; }
  .idea .n { color: var(--sm-muted); font-weight: 500; }
  .idea .d { grid-column: 2; font-size: 12px; line-height: 1.5; color: var(--sm-muted); }
  .idea .act { grid-column: 2; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .flag { font: 500 11px/1 var(--sm-sans); color: #6b5a3a; background: #f3ede1; border-radius: 999px; padding: 3px 7px; white-space: nowrap; }
  .chipset button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--sm-line); border-radius: 999px; background: var(--sm-card); font-size: 12px; cursor: pointer; }
  .chipset button[aria-pressed="true"] { border-color: var(--sm-ink); box-shadow: inset 0 0 0 1px var(--sm-ink); }
  .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #0000001f; flex: none; }
  .note { margin: 14px 0 0; font: 300 12px/1.5 var(--sm-sans); color: var(--sm-quiet); }

  /* Shared surfaces */
  .canvas { position: relative; overflow: hidden; }
  canvas.cl { position: absolute; left: 0; top: 0; pointer-events: none; }
  .light { position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse 55% 40% at 50% 4%, #ffffff70, #fff0 70%), radial-gradient(ellipse 110% 85% at 50% 35%, #0000 55%, #2a1c0c17 100%); }
  .dark { position: relative; z-index: 2; background: var(--sm-ink); color: #fff; border: 1px solid var(--sm-ink); border-top: 3px solid var(--sm-ink); border-radius: 6px; box-shadow: var(--sm-shadow-sm); }
  .ohead { padding: 12px 16px; }
  .ohead h3 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2; }
  .panelcol { display: grid; gap: 16px; margin: 0 6px; padding: 18px 14px 20px 32px; background-color: var(--sm-panel); background-image: var(--hex); background-size: var(--hex-size); border-radius: 0 0 10px 10px; box-shadow: var(--sm-shadow-panel); }
  .card { position: relative; z-index: 2; padding: 14px 16px 0; background: var(--sm-card); border: 1px solid #e3e3e3; border-radius: 10px; box-shadow: var(--sm-shadow); }
  .claim { margin: 0 0 8px; font-size: 14px; line-height: 1.5; }
  .by { margin-bottom: 10px; font: 300 12px var(--sm-sans); color: var(--sm-quiet); }
  .cfoot { display: flex; align-items: center; gap: 8px; margin: 0 -16px; padding: 8px 12px 8px 16px; border-top: 1px solid #ececec; font-size: 12px; color: var(--sm-muted); font-variant-numeric: tabular-nums; }
  .meter { display: inline-flex; gap: 2px; }
  .meter i { width: 4px; height: 10px; border-radius: 1px; background: #dadada; }
  .vote { position: absolute; left: -25px; top: 12px; display: grid; justify-items: center; width: 30px; padding: 2px 0; background: var(--sm-card); border: 1px solid #e3e3e3; border-radius: 6px; box-shadow: var(--sm-shadow-sm); font: 600 11px/1.4 var(--sm-sans); font-variant-numeric: tabular-nums; }
  .vote span.b, .hvote span.b { display: grid; place-items: center; width: 26px; height: 22px; color: var(--sm-muted); }
  .vote svg, .hvote svg { width: 12px; height: 12px; }
  .vote svg path, .hvote svg path { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }

  /* ---------- Sign-in ---------- */
  .signin { position: relative; isolation: isolate; overflow: hidden; min-height: calc(100vh - 56px); display: grid; justify-items: center; align-content: start; padding: 56px 32px 64px; }
  .si-cur { position: absolute; inset: 0; z-index: -2; background-color: var(--sm-canvas-cool); background-image: var(--sm-grain), var(--sm-tex-dots); background-size: 180px 180px, 18px 18px; }
  .si-map { position: absolute; inset: -40px; z-index: -2; background-color: var(--sm-canvas-stone); transition: background-color 2600ms var(--sm-ease); }
  .si-map.pan { animation: pan 50s ease-in-out infinite alternate; }
  @keyframes pan { from { transform: translate3d(-16px, -10px, 0); } to { transform: translate3d(16px, 10px, 0); } }
  @media (prefers-reduced-motion: reduce) { .si-map.pan { animation: none; } .si-map { transition: none; } }
  .si-grid { display: grid; gap: 40px; width: 100%; max-width: 380px; }
  .si-grid.two { max-width: 1060px; grid-template-columns: minmax(0, 1fr) 350px; align-items: center; }
  .auth { display: grid; gap: 14px; padding: 20px; background: var(--sm-card); border-radius: 10px; box-shadow: var(--sm-shadow-hover); }
  .auth h1 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2; }
  .gbtn { height: 38px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--sm-line); border-radius: 6px; background: #fff; font-size: 13px; font-weight: 500; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--sm-muted); font-size: 12px; }
  .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--sm-line); }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .field input { width: 100%; height: 38px; border: 1px solid var(--sm-line); border-radius: 6px; padding: 0 10px; font: inherit; background: #fff; }
  .solid { height: 40px; border: 0; border-radius: 6px; background: var(--sm-ink); color: #fff; font-weight: 600; font-size: 14px; }
  .terms { margin: 0; font-size: 11px; color: var(--sm-muted); }

  .window { position: relative; isolation: isolate; overflow: hidden; border-radius: 12px; border: 1px solid #00000014; box-shadow: var(--sm-shadow-lg); }
  .wbg { position: absolute; inset: 0; z-index: -1; }
  .wwires { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; overflow: visible; }
  .wwires path, .wires path { fill: none; stroke: var(--sm-wire); stroke-width: 1; stroke-dasharray: 1; }
  .wboard { padding: 24px 22px 28px 30px; }
  .wq { width: 84%; margin: 0 auto 34px; padding: 14px 18px; }
  .wq h2 { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.2; }
  .wcols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start; }
  .wcols .ohead { padding: 9px 12px; }
  .wcols .ohead h3 { font-size: 15px; }
  .wcols .panelcol { gap: 10px; padding: 12px 10px 14px 26px; margin: 0 4px; }
  .wcols .card { padding: 10px 12px 0; }
  .wcols .claim { font-size: 13px; margin-bottom: 8px; }
  .wcols .cfoot { margin: 0 -12px; padding: 6px 10px 6px 12px; }
  .wcols .vote { left: -21px; top: 8px; width: 26px; }
  .wcols .vote span.b { width: 22px; height: 18px; }

  /* ---------- Home ---------- */
  .home { position: relative; isolation: isolate; display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 56px); background: var(--sm-list-bg); }
  .homebg { position: absolute; inset: 0; z-index: -2; }
  .side { padding: 14px 10px; background: #242424; color: #fff; }
  .side .gl { color: #ffffff99; margin: 18px 8px 8px; }
  .grp { padding: 4px; background: #ffffff0a; border: 1px solid #ffffff14; border-radius: 10px; }
  .srow { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border: 0; border-radius: 6px; background: transparent; color: inherit; text-align: left; cursor: pointer; transition: background var(--sm-fast) var(--sm-ease); }
  .srow:hover { background: #ffffff14; }
  .srow[aria-current="true"] { background: #fff; color: var(--sm-ink); }
  .srow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
  .srow .tag { padding: 2px 6px; border: 1px solid currentColor; border-radius: 6px; font: 500 11px/1.3 var(--sm-sans); letter-spacing: .08em; text-transform: uppercase; }
  .srow .ct { margin-left: auto; font-size: 12px; opacity: .55; }
  .newsp { margin-top: 10px; border: 1px dashed #ffffff40; color: #ffffffb3; font-size: 13px; }
  /* Option: a light, see-through sidebar with canvas tiles */
  .side.lite { background: color-mix(in srgb, var(--sm-card) 62%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--sm-ink); border-right: 1px solid #00000012; }
  .side.lite .gl { color: var(--sm-muted); }
  .side.lite .grp { padding: 0; background: transparent; border: 0; }
  .side.lite .srow:hover { background: #00000009; }
  .side.lite .srow[aria-current="true"] { background: var(--sm-card); box-shadow: var(--sm-shadow-sm); }
  .side.lite .newsp { border-color: #00000026; color: var(--sm-muted); }
  .stile { position: relative; width: 26px; height: 26px; border-radius: 6px; border: 1px solid #0000001a; overflow: hidden; flex: none; }
  .srow .name { font-size: 13px; font-weight: 500; }

  .feed { padding: 20px 28px 72px; min-width: 0; }
  .sort { display: inline-flex; gap: 2px; margin-bottom: 14px; padding: 3px; background: var(--sm-card); border-radius: 8px; box-shadow: var(--sm-shadow-sm); }
  .sort span { padding: 4px 9px; border-radius: 6px; font-size: 12px; }
  .sort span.on { background: var(--sm-ink); color: #fff; }
  .items { display: grid; gap: 12px; max-width: 780px; }
  .item { position: relative; overflow: hidden; display: grid; grid-template-columns: 40px minmax(0, 1fr) 156px; gap: 12px; padding: 16px 16px 16px 10px; background: var(--sm-card); border: 1px solid #e3e3e3; border-radius: 10px; box-shadow: var(--sm-shadow-sm); cursor: pointer; transition: translate var(--sm-medium) var(--sm-ease), box-shadow var(--sm-medium) var(--sm-ease); }
  .item:hover { translate: 0 -3px; box-shadow: var(--sm-lift); }
  .score-col { display: grid; justify-items: center; align-content: start; gap: 4px; padding-top: 2px; font: 600 13px var(--sm-sans); }
  .score-col svg { width: 15px; height: 15px; fill: none; stroke: var(--sm-muted); stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
  .line1 { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sm-muted); }
  .stag { padding: 2px 6px; border: 1.5px solid var(--sm-ink); border-radius: 6px; color: var(--sm-ink); font: 500 11px/1.2 var(--sm-sans); letter-spacing: .08em; text-transform: uppercase; }
  .ititle { margin: 6px 0 10px; font-size: 20px; font-weight: 600; line-height: 1.25; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 4px 0 9px; border-radius: 6px; background: var(--sm-ink); color: #fff; font-size: 12px; font-weight: 600; }
  .chip b { padding: 1px 6px; border-radius: 4px; background: #ffffff26; font: 600 11px var(--sm-sans); }
  .line3 { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--sm-muted); }
  .line3 svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
  .mini { position: relative; align-self: center; height: 100px; overflow: hidden; border-radius: 6px; border: 1px solid #0000000f; transition: translate var(--sm-medium) var(--sm-ease), scale var(--sm-medium) var(--sm-ease), box-shadow var(--sm-medium) var(--sm-ease); }
  .item:hover .mini { translate: 0 -2px; scale: 1.035; box-shadow: var(--sm-shadow); }
  .mshape { position: absolute; left: 10px; right: 10px; top: 10px; }
  .mq { height: 9px; margin: 0 12% 8px; border-radius: 2px; background: var(--sm-ink); }
  .mcols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mcol { display: grid; gap: 3px; padding: 0 3px 4px; border-radius: 2px; background: #f7f7f7d9; }
  .mcol b { height: 6px; margin: 0 -3px 1px; border-radius: 2px 2px 0 0; background: var(--sm-ink); }
  .mcol i { height: 9px; border: 1px solid #dcdcdc; border-radius: 2px; background: #fff; }
  .strip { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 2px; height: 4px; }
  .strip i { flex: 1; }
  .items.banner { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 880px; }
  .items.banner .item { grid-template-columns: 34px minmax(0, 1fr); align-content: start; padding-top: 0; }
  .items.banner .mini { grid-column: 1 / -1; grid-row: 1; height: 124px; margin: 0 -16px 4px -10px; border: 0; border-radius: 0; }
  .items.banner .item:hover .mini { translate: none; scale: 1.02; box-shadow: none; }
  .items.banner .mshape { left: 24%; right: 24%; top: 18px; }
  .explore { margin-top: 32px; max-width: 880px; }
  .explore .gl { margin-top: 0; }
  .excards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .excard { overflow: hidden; background: var(--sm-card); border: 1px solid #e3e3e3; border-radius: 10px; box-shadow: var(--sm-shadow-sm); transition: translate var(--sm-medium) var(--sm-ease), box-shadow var(--sm-medium) var(--sm-ease); }
  .excard:hover { translate: 0 -3px; box-shadow: var(--sm-lift); }
  .exban { height: 78px; border-bottom: 1px solid #0000000f; }
  .exbody { display: grid; gap: 6px; padding: 12px 14px 14px; }
  .exbody h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.25; }
  .exbody p { margin: 0; font-size: 12px; line-height: 1.45; color: var(--sm-muted); }
  .exfoot { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; font-size: 12px; color: var(--sm-muted); }

  /* ---------- Axes ---------- */
  .axes { position: relative; isolation: isolate; overflow: hidden; min-height: calc(100vh - 56px); }
  .axbg { position: absolute; inset: 0; z-index: -2; }
  .ax-inner { max-width: 1060px; margin: 0 auto; padding: 30px 48px 80px; }
  .ax-label { margin: 0 0 12px 64px; font: 500 11px/1 var(--sm-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--sm-muted); }
  .ax-block { position: relative; padding-left: 64px; margin-bottom: 44px; }
  .ax-col { max-width: 500px; }
  .vaxis { position: absolute; left: 0; top: 0; bottom: 0; width: 64px; }
  .haxis { position: relative; height: 34px; margin-bottom: 8px; }
  .versions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .vcard { padding-bottom: 0; }
  .hvote { display: inline-flex; align-items: center; padding: 0 2px; border: 1px solid #e3e3e3; border-radius: 6px; background: var(--sm-card); font: 600 11px var(--sm-sans); }
  .hvote span.b { width: 22px; height: 22px; }
  .ah { fill: #5c5c5c; stroke: #5c5c5c; stroke-width: 1; stroke-linejoin: round; }
  .at { font: 500 11px var(--sm-sans); letter-spacing: .07em; fill: var(--sm-axis); }
  .num { font-family: var(--sm-serif); font-weight: 300; fill: #242424; }
  /* The current axes, simplified from the prototype */
  .cur-v { position: absolute; left: 30px; width: 20px; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 9px 0; border: 1px solid var(--sm-line); border-radius: 999px; background: var(--sm-card); box-shadow: var(--sm-shadow-sm); font: 500 10px/1 var(--sm-sans); letter-spacing: .07em; text-transform: uppercase; color: var(--sm-axis); white-space: nowrap; }
  .cur-v .lab { writing-mode: vertical-rl; transform: rotate(180deg); }
  .cur-v .ln, .cur-h .ln { position: relative; flex: 1; background: var(--sm-axis-line); }
  .cur-v .ln { width: 1px; }
  .cur-h .ln { height: 1px; }
  .hd { position: absolute; width: 12px; height: 8px; overflow: visible; }
  .hd path { fill: #5c5c5c; stroke: #5c5c5c; stroke-width: 1; stroke-linejoin: round; }
  .cur-v .hd { top: 1px; left: -5.5px; transform: rotate(90deg); }
  .cur-h { position: absolute; top: 5px; display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 6px 0 11px; border: 1px solid var(--sm-line); border-radius: 999px; background: var(--sm-card); font: 500 10px/1 var(--sm-sans); letter-spacing: .07em; text-transform: uppercase; color: var(--sm-axis); white-space: nowrap; }
  .cur-h .hd { top: -3.5px; left: -1px; }
  .cur-h .hd + .hd { left: auto; right: -1px; transform: scaleX(-1); }
  .cur-h .pager { font: 400 12px var(--sm-sans); letter-spacing: 0; text-transform: none; color: var(--sm-muted); }
  .cur-h svg.fold { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  @media (max-width: 1000px) {
    .si-grid.two { grid-template-columns: 1fr; max-width: 560px; }
    .si-grid.two .auth { order: -1; }
    .excards { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .controls { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--sm-line); }
  }
  @media (max-width: 720px) {
    .topbar { padding: 0 16px; gap: 10px; }
    .crumb { display: none; }
    .home { grid-template-columns: 1fr; }
    .side { display: none; }
    .feed { padding: 16px; }
    .item, .items.banner { grid-template-columns: 34px minmax(0, 1fr); }
    .items.banner { grid-template-columns: 1fr; }
    .mini { display: none; }
    .items.banner .mini { display: block; }
    .ax-inner { padding: 24px 16px 60px; }
    .versions { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="../logo.svg" alt="">steelman.</div>
  <span class="crumb">Color and axes</span>
  <span class="grow"></span>
  <div class="seg" role="group" aria-label="Screen">
    <button type="button" data-tab="signin" aria-pressed="true">Sign-in</button>
    <button type="button" data-tab="home" aria-pressed="false">New person’s Home</button>
    <button type="button" data-tab="axes" aria-pressed="false">Axes</button>
  </div>
  <button type="button" class="btn" id="compare" aria-pressed="false">Hold to compare</button>
</header>
<div class="layout">
  <aside class="controls" id="controls" aria-label="Options"></aside>
  <main id="stage"></main>
</div>

<script>
(() => {

        </div>
        ${explore ? `<section class="explore"><div class="gl">Communities to explore</div><div class="excards">${COMMUNITIES.map(x => `
          <article class="excard"><div class="exban canvas" data-canvas="${x.canvas}" data-off="${x.off}"></div>
            <div class="exbody"><h3 class="serif">${x.name}</h3><p>${x.about}</p><div class="exfoot"><span>${x.members} members</span><button type="button" class="btn small">Join</button></div></div></article>`).join('')}</div></section>` : ''}
      </div></section>`;
    paintHome();
  }
  function paintHome() {
    const c = S.comparing, bg = $('#homebg'); if (!bg) return;
    if (c) { bg.style.background = 'var(--sm-list-bg)'; const cv = $('canvas', bg); if (cv) cv.hidden = true; }
    else canvasLayer(bg, S.home.canvas ? S.home.pick : 'neutral', { offX: 300 });
    $$('.home .mini').forEach((m, i) => canvasLayer(m, m.dataset.canvas, { k: 3, fine: false, alpha: .45, lw: .7, offX: 700 + i * 500 }));
    $$('.home .stile').forEach(t => canvasLayer(t, t.dataset.canvas, { k: 5, fine: false, alpha: .55, lw: .6, offX: 200 }));
    $$('.home .exban').forEach(b => canvasLayer(b, b.dataset.canvas, { k: 1.4, alpha: .3, offX: +b.dataset.off }));
  }

  // ---------- Axes ----------
  const COL = [
    { score: 44, t: 'If the best open-weight models were American, China’s AI would be built on them. Releasing its own keeps China’s stack independent of US companies.', by: 'maya.chen', pct: 70, n: 20 },
    { score: 39, t: 'A closed Chinese model could reach Western users only as a service run from China, which governments and companies avoid. Open weights run on their own servers.', by: 'jordan_w', pct: 80, n: 20 },
    { score: 30, t: 'China controls AI where it’s deployed: every public AI service must be filed with regulators, so open weights cost it little control at home.', by: 'you', pct: 88, n: 17 },
  ];
  const VERSIONS = [
    { score: 18, t: 'If the best open-weight models were American, China’s AI would be built on them. Releasing its own keeps China’s stack independent of US companies.', by: 'maya.chen', pct: 70 },
    { score: 11, t: 'China releases open models so its developers don’t have to build on American ones.', by: 'priya_s', pct: 62 },
    { score: 4, t: 'Open weights help China avoid relying on the US.', by: 'samr_92', pct: 45 },
  ];
  function renderAxes() {
    stage.innerHTML = `<section class="axes">
      <div class="axbg canvas" id="axbg"></div><div class="light"></div>
      <div class="ax-inner">
        <div class="ax-label">Importance, down a column</div>
        <div class="ax-block" id="vblock"><div class="vaxis" id="vaxis"></div>
          <div class="ax-col"><div class="ohead dark"><h3 class="serif">Why it makes sense</h3></div>
            <div class="panelcol">${COL.map(c => `<article class="card"><div class="vote"><span class="b">${ICON.up}</span><span>${c.score}</span><span class="b">${ICON.down}</span></div>
              <p class="claim">${c.t}</p><div class="by">${c.by}</div><footer class="cfoot">${meter(c.pct)}<span>${c.pct}% · ${c.n}</span></footer></article>`).join('')}</div></div>
        </div>
        <div class="ax-label">Articulation, across an unfolded row</div>
        <div class="ax-block" id="hblock"><div class="haxis" id="haxis"></div>
          <div class="versions">${VERSIONS.map(v => `<article class="card vcard"><p class="claim">${v.t}</p><div class="by">${v.by}</div>
            <footer class="cfoot"><span class="hvote"><span class="b">${ICON.left}</span>${v.score}<span class="b">${ICON.right}</span></span><span class="grow"></span>${meter(v.pct)}<span>${v.pct}%</span></footer></article>`).join('')}</div>
        </div>
      </div></section>`;
    paintAxes();
  }
  const svgOpen = (w, h) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" overflow="visible" aria-hidden="true" style="position:absolute;left:0;top:0">`;
  const arrow = (x, y, deg) => `<path class="ah" d="${HEAD}" transform="translate(${x} ${y}) rotate(${deg}) translate(-.5 -4)"/>`;
  // A label set along a vertical axis, reading upward. With "end" it hangs below (x, y); with "start" it rises above it.
  const vlab = (x, y, t, anchor = 'end') => `<text class="at" transform="translate(${x} ${y}) rotate(-90)" text-anchor="${anchor}">${t}</text>`;
  const hexPath = (cx, cy, r, attrs) => { let d = ''; for (let k = 0; k < 6; k++) { const a = Math.PI / 180 * (60 * k - 90); d += (k ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(2) + ' ' + (cy + r * Math.sin(a)).toFixed(2); } return `<path d="${d}Z" ${attrs}/>`; };
  const INK = '#242424', AXL = '#5c5c5c', WIRE = '#767676';

  const V = {
    current: g => `<div class="cur-v" style="top:${g.top + 12}px;height:${g.bottom - g.top - 24}px"><span class="lab">More important</span><span class="ln">${headSvg}</span><span class="lab">Less important</span></div>`,
    scale: g => {
      const x0 = 34, w = 6, b = [g.top + 14, ...g.ys.slice(1).map((y, i) => (g.ys[i] + y) / 2), g.bottom - 14];
      let s = svgOpen(g.W, g.H);
      for (let i = 0; i < b.length - 1; i++) s += `<rect x="${x0}" y="${b[i]}" width="${w}" height="${b[i + 1] - b[i]}" fill="${i % 2 ? '#fff' : INK}"/>`;
      s += `<rect x="${x0 + .5}" y="${b[0] + .5}" width="${w - 1}" height="${b.at(-1) - b[0] - 1}" fill="none" stroke="${INK}"/>`;
      g.ys.forEach(y => { s += `<line x1="${x0 + w}" x2="${x0 + w + 8}" y1="${y}" y2="${y}" stroke="${INK}"/>`; });
      return s + vlab(x0 - 6, b[0], 'MORE IMPORTANT') + vlab(x0 - 6, b.at(-1), 'LESS', 'start') + '</svg>';
    },
    wedge: g => {
      const t = g.top + 14, b = g.bottom - 14, cx = 40;
      return svgOpen(g.W, g.H) + `<defs><linearGradient id="wgv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${INK}" stop-opacity=".85"/><stop offset="1" stop-color="${INK}" stop-opacity=".08"/></linearGradient></defs>
        <path d="M${cx - 6} ${t}H${cx + 6}L${cx} ${b}Z" fill="url(#wgv)"/>` + vlab(cx - 12, t, 'MORE IMPORTANT') + '</svg>';
    },
    rank: g => svgOpen(g.W, g.H) + g.ys.map((y, i) => `<text class="num" x="52" y="${y}" text-anchor="end" dominant-baseline="central" font-size="32" fill-opacity=".5">${i + 1}</text>`).join('') + '</svg>',
    hex: g => {
      const cx = 42, mn = Math.min(...g.scores), mx = Math.max(...g.scores);
      let s = svgOpen(g.W, g.H) + `<line x1="${cx}" x2="${cx}" y1="${g.ys[0]}" y2="${g.ys.at(-1)}" stroke="${AXL}"/>`;
      g.ys.forEach((y, i) => { s += hexPath(cx, y, 4 + 8 * (g.scores[i] - mn) / Math.max(1, mx - mn), `fill="#fff" stroke="${INK}" stroke-width="1.2"`); });
      return s + vlab(22, g.top + 14, 'MORE IMPORTANT') + '</svg>';
    },
    wire: g => {
      const x = 42, end = g.bottom - 4;
      let s = svgOpen(g.W, g.H) + `<path d="M64 ${g.headY}H${x}V${end - 2}" fill="none" stroke="${WIRE}"/>`;
      g.ys.forEach(y => { s += `<path d="M${x} ${y}H${g.voteX}" fill="none" stroke="${WIRE}"/><circle cx="${x}" cy="${y}" r="2.5" fill="${WIRE}"/>`; });
      return s + arrow(x, end, -90) + vlab(x - 12, g.headBottom + 14, 'MORE IMPORTANT') + '</svg>';
    },
  };
  const Hz = {
    current: h => `<div class="cur-h" style="left:${h.L}px;width:${h.R - h.L}px"><span>Best articulation</span><span class="ln">${headSvg}${headSvg}</span><span>Weaker</span><span class="pager">1 of 3 · best articulated</span>${ICON.fold}</div>`,
    scale: h => {
      const y0 = 17, hh = 6, b = [h.L, ...h.lefts.slice(1).map((l, i) => (h.rights[i] + l) / 2), h.R];
      let s = svgOpen(h.W, h.H);
      for (let i = 0; i < b.length - 1; i++) s += `<rect x="${b[i]}" y="${y0}" width="${b[i + 1] - b[i]}" height="${hh}" fill="${i % 2 ? '#fff' : INK}"/>`;
      s += `<rect x="${h.L + .5}" y="${y0 + .5}" width="${h.R - h.L - 1}" height="${hh - 1}" fill="none" stroke="${INK}"/>`;
      h.xs.forEach(x => { s += `<line x1="${x}" x2="${x}" y1="${y0 + hh}" y2="${y0 + hh + 8}" stroke="${INK}"/>`; });
      return s + `<text class="at" x="${h.L}" y="11">BEST ARTICULATION</text><text class="at" x="${h.R}" y="11" text-anchor="end">WEAKER</text></svg>`;
    },
    wedge: h => svgOpen(h.W, h.H) + `<defs><linearGradient id="wgh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${INK}" stop-opacity=".85"/><stop offset="1" stop-color="${INK}" stop-opacity=".08"/></linearGradient></defs>
      <path d="M${h.L} 18V30L${h.R} 24Z" fill="url(#wgh)"/><text class="at" x="${h.L}" y="11">BEST ARTICULATION</text></svg>`,
    rank: h => svgOpen(h.W, h.H) + h.lefts.map((l, i) => `<text class="num" x="${l + 2}" y="${h.H - 4}" font-size="26" fill-opacity=".55">${i + 1}</text>`).join('') + `<text class="at" x="${h.lefts[0] + 22}" y="${h.H - 8}">BEST</text></svg>`,
    hex: h => {
      const y = 22, tones = [1, .5, .18];
      return svgOpen(h.W, h.H) + `<line x1="${h.xs[0]}" x2="${h.xs.at(-1)}" y1="${y}" y2="${y}" stroke="${AXL}"/>` +
        h.xs.map((x, i) => hexPath(x, y, 8, `fill="${INK}" fill-opacity="${tones[i]}" stroke="${INK}" stroke-width="1.2"`)).join('') +
        `<text class="at" x="${h.L}" y="11">BEST ARTICULATION</text></svg>`;
    },
    wire: h => {
      const y = 20, drop = h.H + 8;
      let s = svgOpen(h.W, h.H) + `<path d="M${h.L - 30} ${y}H${h.R - 2}" fill="none" stroke="${WIRE}"/>`;
      h.xs.forEach(x => { s += `<path d="M${x} ${y}V${drop}" fill="none" stroke="${WIRE}"/><circle cx="${x}" cy="${y}" r="2.5" fill="${WIRE}"/>`; });
      return s + arrow(h.R, y, 180) + `<text class="at" x="${h.L}" y="9">BEST ARTICULATION</text></svg>`;
    },
  };
  function paintAxes() {
    const bg = $('#axbg'); if (!bg) return;
    canvasLayer(bg, 'stone', { offX: 500 });
    const which = S.comparing ? 'current' : S.axis;
    const blk = $('#vblock'), br = blk.getBoundingClientRect();
    const panel = $('.panelcol', blk).getBoundingClientRect(), head = $('.ohead', blk).getBoundingClientRect();
    const cards = $$('.card', blk).map(c => c.getBoundingClientRect());
    $('#vaxis').innerHTML = V[which]({
      W: 64, H: br.height, ys: cards.map(r => r.top - br.top + 31), top: panel.top - br.top, bottom: panel.bottom - br.top,
      headY: head.top - br.top + head.height / 2, headBottom: head.bottom - br.top, voteX: cards[0].left - br.left - 25, scores: COL.map(c => c.score),
    });
    const ha = $('#haxis'), hr = ha.getBoundingClientRect(), vs = $$('#hblock .vcard').map(r => r.getBoundingClientRect());
    const lefts = vs.map(r => r.left - hr.left), rights = vs.map(r => r.right - hr.left);
    $('#haxis').innerHTML = Hz[which]({ W: hr.width, H: hr.height, lefts, rights, xs: vs.map((r, i) => (lefts[i] + rights[i]) / 2), L: lefts[0], R: rights.at(-1) });
  }

  // ---------- Wiring ----------
  function renderStage() {
    clearInterval(tourTimer);
    ({ signin: renderSignin, home: renderHome, axes: renderAxes })[S.tab]();
  }
  function paint() { ({ signin: paintSignin, home: paintHome, axes: paintAxes })[S.tab](); }
  $$('.seg button').forEach(b => b.addEventListener('click', () => {
    S.tab = b.dataset.tab;
    $$('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    scrollTo({ top: 0 }); renderControls(); renderStage();
  }));
  const cmp = $('#compare');
  const down = () => { if (S.comparing) return; S.comparing = true; cmp.setAttribute('aria-pressed', 'true'); renderStage(); };
  const up = () => { if (!S.comparing) return; S.comparing = false; cmp.setAttribute('aria-pressed', 'false'); renderStage(); };
  cmp.addEventListener('pointerdown', e => { e.preventDefault(); down(); });
  ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach(t => cmp.addEventListener(t, up));
  cmp.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); down(); } });
  cmp.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') up(); });
  let timer = 0, lastW = 0;
  new ResizeObserver(() => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(timer); timer = setTimeout(paint, 140); }).observe(document.body);

  renderControls(); renderStage();
  document.fonts.ready.then(() => { paint(); });
})();
</script>
</body>
</html>
