&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

&lt;style&gt;
  @import url(&#x27;https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&amp;family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,300&amp;display=swap&#x27;);
  /* @tokens: docs/design/tokens.css is inserted here by scripts/sync-prototype.py */
/*
  Steelman design tokens: the one place for color, type, and texture.

  - The product page links this file directly (docs/index.html).
  - The prototype runs in a sandboxed frame that cannot load local files, so
    scripts/sync-prototype.py copies this file into docs/prototype/index.html.
    After editing, run:  python3 scripts/sync-prototype.py
  - See every token and component together at docs/design/index.html.
*/
:root {
  /* Surfaces */
  --sm-paper:#f4f4f4;        /* canvas behind the diagram */
  --sm-card:#fdfdfd;         /* argument cards, headers, controls */
  --sm-soft:#eee;            /* hover fill */

  /* Ink */
  --sm-ink:#242424;          /* text and strong rules */
  --sm-muted:#686868;        /* secondary text */
  --sm-selected:#292929;     /* pressed controls */
  --sm-on-selected:#fff;     /* icon or text on a pressed control */

  /* Lines */
  --sm-line:#d1d1d1;         /* card borders and dividers */
  --sm-wire:#aaa;            /* connectors between question, options, and arguments */

  /* Axes (importance and articulation) */
  --sm-axis:#8e8e8e;         /* axis labels */
  --sm-axis-line:#c2c2c2;    /* axis hairline and arrowheads */

  /* Texture: grayscale paper grain laid over surfaces */
  --sm-grain:url(&quot;data:image/svg+xml,%3Csvg viewBox=&#x27;0 0 180 180&#x27; xmlns=&#x27;http://www.w3.org/2000/svg&#x27;%3E%3Cfilter id=&#x27;grain&#x27;%3E%3CfeTurbulence type=&#x27;fractalNoise&#x27; baseFrequency=&#x27;.85&#x27; numOctaves=&#x27;3&#x27; stitchTiles=&#x27;stitch&#x27;/%3E%3CfeColorMatrix type=&#x27;saturate&#x27; values=&#x27;0&#x27;/%3E%3CfeComponentTransfer%3E%3CfeFuncA type=&#x27;linear&#x27; slope=&#x27;.085&#x27;/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Cpath fill=&#x27;%23fff&#x27; filter=&#x27;url(%23grain)&#x27; d=&#x27;M0 0h180v180H0z&#x27;/%3E%3C/svg%3E&quot;);

  /* Type */
  --sm-serif:&quot;Source Serif 4&quot;,Georgia,&quot;Times New Roman&quot;,serif;      /* questions, headings, axis labels */
  --sm-sans:&quot;Libre Franklin&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif;     /* claims and interface */
}
  #steelman-study {
    font-family:var(--sm-sans); color:var(--sm-ink); color-scheme:light; background:transparent;
  }
  #steelman-study * { box-sizing:border-box; }
  #steelman-study button, #steelman-study textarea { font:inherit; color:inherit; }
  #steelman-study button { -webkit-tap-highlight-color:transparent; cursor:pointer; }
  #steelman-study button:disabled { opacity:.45; cursor:default; }
  #steelman-study :is(button,textarea,summary,[tabindex]):focus-visible { outline:2px solid var(--sm-ink); outline-offset:3px; }
  #steelman-study button svg { flex:none; }
  #steelman-study .sm-site { display:flex; align-items:center; min-height:56px; padding:10px 22px; background:#fff; border-bottom:1px solid var(--sm-ink); }
  #steelman-study .sm-wordmark { display:flex; align-items:center; gap:8px; font:700 23px var(--sm-serif); letter-spacing:-1px; }
  #steelman-study .sm-logo { display:grid; place-items:center; width:23px; height:24px; border-radius:3px; background:var(--sm-selected); color:var(--sm-on-selected); font-size:20px; line-height:1; letter-spacing:0; }
  #steelman-study .sm-surface { background-color:var(--sm-paper); background-image:var(--sm-grain),radial-gradient(circle,#d8d8d8 .65px,transparent .8px); background-size:180px 180px,18px 18px; }
  #steelman-study .sm-scene { position:relative; padding:30px 28px 24px; isolation:isolate; }
  #steelman-study .sm-links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:visible; }
  #steelman-study .sm-links path { fill:none; stroke:var(--sm-wire); stroke-width:1.3; stroke-linejoin:round; }
  #steelman-study .sm-links circle { fill:var(--sm-card); stroke:var(--sm-wire); stroke-width:1.2; }
  #steelman-study .sm-head { position:relative; z-index:1; width:86%; margin:0 auto; padding:22px 25px 24px; background:var(--sm-grain) var(--sm-card); border:1px solid var(--sm-line); border-top:3px solid var(--sm-ink); border-radius:8px; box-shadow:0 2px 3px #00000005,0 8px 18px #00000005; }
  #steelman-study h1 { font:700 32px/1.16 var(--sm-serif); letter-spacing:-.8px; margin:0; text-wrap:balance; }
  /* Two option columns with the shared importance axis between them. Opening a stack widens its column. */
  #steelman-study .sm-board { display:grid; grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr); padding-top:56px; }
  #steelman-study .sm-board[data-open=&quot;open&quot;] { grid-template-columns:minmax(0,2.6fr) 56px minmax(0,1fr); }
  #steelman-study .sm-board[data-open=&quot;keep&quot;] { grid-template-columns:minmax(0,1fr) 56px minmax(0,2.6fr); }
  #steelman-study .sm-axis-cell { display:flex; justify-content:center; padding:100px 0 22px; min-width:0; }
  #steelman-study .sm-column { min-width:0; position:relative; padding:0 12px 16px; }
  #steelman-study .sm-column::before { content:&quot;&quot;; position:absolute; inset:17px 0 0; border:1px solid var(--sm-line); border-radius:12px; background:var(--sm-grain) #f0f0f0; z-index:-1; }
  #steelman-study .sm-column-head { position:relative; z-index:1; display:flex; align-items:center; min-height:58px; padding:15px 18px; background:var(--sm-grain) var(--sm-card); border:1px solid var(--sm-line); border-top:2px solid var(--sm-ink); border-radius:7px; margin-bottom:28px; }
  #steelman-study .sm-col-axis { display:none; }
  #steelman-study h2 { font-size:17px; line-height:1.4; font-weight:600; letter-spacing:-.3px; margin:0; }
  #steelman-study .sm-idea { display:grid; grid-template-columns:32px minmax(0,1fr); gap:8px; margin-bottom:24px; align-items:start; position:relative; z-index:1; }
  #steelman-study .sm-idea:last-child { margin-bottom:0; }
  #steelman-study .sm-idea &gt; .sm-vote { margin-top:12px; justify-self:center; }

  /* Axis: hairline with swept arrowheads and light lowercase italic labels at each end. */
  #steelman-study .sm-axis { display:flex; align-items:center; gap:10px; color:var(--sm-axis); font:italic 300 13px/1 var(--sm-serif); letter-spacing:.01em; text-transform:lowercase; white-space:nowrap; min-width:0; }
  #steelman-study .sm-axis-line { position:relative; flex:1; height:1px; min-width:24px; background:var(--sm-axis-line); }
  #steelman-study .sm-axis-head { position:absolute; width:12px; height:8px; color:var(--sm-axis-line); overflow:visible; }
  #steelman-study .sm-axis-head path { fill:none; stroke:currentColor; stroke-width:1; stroke-linecap:round; }
  #steelman-study .sm-axis[data-axis=&quot;h&quot;] .sm-axis-head { top:-3.5px; left:-1px; }
  #steelman-study .sm-axis[data-axis=&quot;h&quot;] .sm-axis-head + .sm-axis-head { left:auto; right:-1px; transform:scaleX(-1); }
  #steelman-study .sm-axis[data-axis=&quot;v&quot;] { flex-direction:column; height:100%; gap:12px; }
  #steelman-study .sm-axis[data-axis=&quot;v&quot;] .sm-axis-line { width:1px; min-width:0; height:auto; min-height:24px; }
  #steelman-study .sm-axis[data-axis=&quot;v&quot;] .sm-axis-head { top:1px; left:-5.5px; transform:rotate(90deg); }
  #steelman-study .sm-axis[data-axis=&quot;v&quot;] .sm-axis-head + .sm-axis-head { top:auto; bottom:1px; transform:rotate(-90deg); }
  #steelman-study .sm-axis[data-axis=&quot;v&quot;] .sm-axis-label { writing-mode:vertical-rl; transform:rotate(180deg); }

  /* One vote component for both axes. The horizontal one is the same element turned a quarter turn. */
  #steelman-study .sm-vote { display:inline-flex; flex-direction:column; align-items:center; border:1px solid #c8c8c8; border-radius:7px; padding:2px; background:var(--sm-card); color:var(--sm-muted); }
  #steelman-study .sm-vote[data-axis=&quot;h&quot;] { flex-direction:row; }
  #steelman-study .sm-vote[data-axis=&quot;h&quot;] .sm-vote-btn svg { transform:rotate(-90deg); }
  #steelman-study .sm-vote-btn { display:grid; place-items:center; border:0; border-radius:5px; background:transparent; padding:4px; width:25px; height:25px; }
  #steelman-study .sm-vote-btn:hover { background:var(--sm-soft); color:var(--sm-ink); }
  #steelman-study .sm-vote-btn[aria-pressed=&quot;true&quot;] { background:var(--sm-selected); color:var(--sm-on-selected); }
  #steelman-study .sm-vote-score { display:grid; place-items:center; min-width:24px; min-height:20px; font-size:11px; font-weight:500; font-variant-numeric:tabular-nums; }

  #steelman-study .sm-card-wrap { min-width:0; position:relative; padding-right:24px; }
  #steelman-study .sm-open .sm-card-wrap { padding-right:0; }
  /* The same face, type, and footer are used on the board and in an unfolded row. */
  #steelman-study .sm-card { position:relative; z-index:2; border:1px solid #c8c8c8; border-radius:11px; background-color:var(--sm-card); background-image:var(--sm-grain); box-shadow:0 2px 3px #00000007,0 8px 18px #00000009,inset 0 1px 0 #fff; transition:box-shadow 180ms ease,border-color 180ms ease; min-width:0; }
  #steelman-study .sm-card:hover { border-color:#aaa; box-shadow:0 3px 5px #00000009,0 11px 24px #00000010,inset 0 1px 0 #fff; }
  #steelman-study .sm-claim-button { display:block; width:100%; text-align:left; border:0; padding:18px; background:transparent; border-radius:10px 10px 0 0; }
  #steelman-study .sm-claim { display:block; font:400 16px/1.5 var(--sm-sans); letter-spacing:-.15px; margin:0; overflow-wrap:anywhere; }
  #steelman-study .sm-card-meta { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:4px 9px; border-top:1px solid var(--sm-line); min-height:39px; }
  #steelman-study .sm-card-tools { display:flex; align-items:center; gap:6px; flex:none; }
  #steelman-study .sm-cred { display:flex; align-items:center; gap:7px; background:transparent; border:0; padding:3px; border-radius:5px; font-size:11px; text-align:left; min-width:0; min-height:28px; }
  #steelman-study .sm-cred:hover, #steelman-study .sm-source-button:hover, #steelman-study .sm-expand:hover { background:var(--sm-soft); }
  #steelman-study .sm-cred-copy { display:flex; align-items:baseline; column-gap:5px; row-gap:2px; flex-wrap:wrap; }
  #steelman-study .sm-percentage { font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; }
  #steelman-study .sm-count { color:var(--sm-muted); font-size:11px; white-space:nowrap; }
  #steelman-study .sm-few { border-bottom:1px dotted var(--sm-muted); }
  #steelman-study .sm-evidence-symbol { display:grid; place-items:center; position:relative; width:17px; height:18px; flex:none; color:var(--sm-ink); }
  #steelman-study .sm-evidence-symbol svg { width:16px; height:16px; stroke-width:1.6; }
  #steelman-study .sm-evidence-symbol.sm-unreviewed { color:var(--sm-muted); }
  #steelman-study .sm-evidence-symbol .sm-stamp { position:absolute; bottom:-1px; right:-3px; background:var(--sm-card); border-radius:50%; width:12px; height:12px; }
  #steelman-study .sm-evidence-symbol .sm-stamp svg { width:12px; height:12px; stroke-width:2.3; }
  #steelman-study .sm-source-button { display:flex; align-items:center; justify-content:center; gap:4px; border:0; background:transparent; padding:5px; min-height:28px; border-radius:5px; font-size:11px; color:var(--sm-muted); }
  #steelman-study .sm-source-button svg { width:13px; height:13px; }
  #steelman-study .sm-expand { display:grid; place-items:center; width:30px; height:28px; padding:6px; border:0; border-left:1px solid var(--sm-line); border-radius:0 4px 4px 0; background:transparent; }
  #steelman-study .sm-expand svg { width:16px; height:16px; stroke-width:1.8; }
  #steelman-study .sm-expanded { border-color:#929292; box-shadow:0 2px 4px #0000000d,0 18px 32px #00000020; }

  /* Paper stack: one edge per hidden version (up to three). A dashed edge means no other version yet. */

  const cards = {
    access: {idea:&#x27;access&#x27;, claim:&#x27;Sunday hours would give some weekday workers their only practical time to visit.&#x27;, yes:24, no:8, pref:26, sources:[&#x27;survey&#x27;,&#x27;hours&#x27;], explanation:&#x27;The case is about access for people whose work overlaps the existing schedule. “Some” matters: the survey supports an unmet need among respondents, not every resident.&#x27;},

    accessNarrow: {idea:&#x27;access&#x27;, claim:&#x27;For 18 surveyed residents, Sunday was the only day they reported being able to visit.&#x27;, yes:3, no:1, pref:4, sources:[&#x27;survey&#x27;], explanation:&#x27;This version stays close to the survey result. It is precise about the sample, but leaves the reader to decide what that finding means for the wider community.&#x27;},
    study: {idea:&#x27;study&#x27;, claim:&#x27;Sunday study space could improve outcomes for students without a quiet place at home.&#x27;, yes:2, no:4, pref:12, sources:[&#x27;study&#x27;], explanation:&#x27;If this effect exists, it could matter a great deal. The cited material establishes a desire for study space, but does not measure learning outcomes.&#x27;},
    purpose: {idea:&#x27;purpose&#x27;, claim:&#x27;A public library should be available on the day families can spend time together.&#x27;, value:true, pref:7, sources:[], explanation:&#x27;This is a judgment about what a public library ought to prioritize. It can matter to the decision without receiving a factual credibility score.&#x27;},

    study: {name:&#x27;Student listening session&#x27;,locator:&#x27;Example packet · p. 3, notes 6–9&#x27;,finding:&#x27;Seven of twelve participants asked for a quiet weekend study space.&#x27;,premise:&#x27;Some students report a need for more weekend study space.&#x27;,limit:&#x27;No academic outcomes were measured. A need for space does not establish an educational benefit.&#x27;},

    budget: {name:&#x27;Four-hour Sunday estimate&#x27;,locator:&#x27;Example packet · p. 5, assumptions&#x27;,finding:&#x27;The estimate assumes two additional staff members for four hours.&#x27;,premise:&#x27;The modeled Sunday session includes extra paid staffing.&#x27;,limit:&#x27;This is one staffing model. It does not prove that every viable model requires extra hours.&#x27;},
    unavailable: {name:&#x27;Evening vs. Sunday cost estimate&#x27;,locator:&#x27;Example packet · attachment unavailable&#x27;,unavailable:true,finding:&#x27;The cited attachment cannot be opened.&#x27;,premise:&#x27;No comparison can be inspected from the available material.&#x27;,limit:&#x27;An unavailable source does not show the claim is false. You can skip assessment or challenge its support.&#x27;},

  };
  const ideas = [
    {id:&#x27;access&#x27;,option:&#x27;open&#x27;,score:42,versions:[&#x27;access&#x27;,&#x27;accessBold&#x27;,&#x27;accessNarrow&#x27;]},
    {id:&#x27;study&#x27;,option:&#x27;open&#x27;,score:31,versions:[&#x27;study&#x27;]},
    {id:&#x27;purpose&#x27;,option:&#x27;open&#x27;,score:12,versions:[&#x27;purpose&#x27;]},
    {id:&#x27;staffing&#x27;,option:&#x27;keep&#x27;,score:39,versions:[&#x27;staffing&#x27;]},
    {id:&#x27;evenings&#x27;,option:&#x27;keep&#x27;,score:25,versions:[&#x27;evenings&#x27;]},

  function restore(raw) {

  const optionName = option =&gt; option===&#x27;open&#x27; ? &#x27;Open on Sundays&#x27; : &#x27;Keep current hours&#x27;;
  const short = id =&gt; { const c=cards[id].claim; return c.length&gt;60 ? c.slice(0,57)+&#x27;…&#x27; : c; };

  const button = (action,label,extra=&#x27;&#x27;) =&gt; `&lt;button type=&quot;button&quot; class=&quot;sm-button cursor-interaction&quot; data-action=&quot;${action}&quot; ${extra}&gt;${label}&lt;/button&gt;`;
