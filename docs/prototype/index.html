  /* Elevation: everything raised above the canvas casts a soft, layered drop shadow */

  --sm-shadow:0 1px 3px #00000024,0 8px 18px #00000024,0 20px 40px #00000017;       /* cards */
  --sm-shadow-hover:0 2px 5px #0000002b,0 12px 26px #0000002e,0 26px 48px #0000001c;
  --sm-shadow-panel:0 2px 4px #0000001a,0 16px 40px #00000024;                      /* option columns */
  --sm-shadow-lg:0 3px 6px #0000002e,0 16px 36px #00000038;                         /* question and option headers */

  /* Texture: grayscale paper grain laid over surfaces */

  /* Type */
  --sm-serif:&quot;Source Serif 4&quot;,Georgia,&quot;Times New Roman&quot;,serif;      /* questions, headings, axis labels */
  --sm-sans:&quot;Libre Franklin&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif;     /* claims and interface */
}
  #steelman-study {
    font-family:var(--sm-sans); color:var(--sm-ink); color-scheme:light; background:transparent;
  }
  #steelman-study * { box-sizing:border-box; }
  #steelman-study button, #steelman-study textarea { font:inherit; color:inherit; }
  #steelman-study button { -webkit-tap-highlight-color:transparent; cursor:pointer; }
  #steelman-study button:disabled { opacity:.45; cursor:default; }
  #steelman-study :is(button,textarea,summary,[tabindex]):focus-visible { outline:2px solid var(--sm-ink); outline-offset:3px; }
  #steelman-study button svg { flex:none; }
  #steelman-study .sm-site { display:flex; align-items:center; min-height:56px; padding:10px 22px; background:#fff; border-bottom:1px solid var(--sm-ink); }
  #steelman-study .sm-wordmark { display:flex; align-items:center; gap:8px; font:700 23px var(--sm-serif); letter-spacing:-1px; }
  /* Logo: honeycomb diamond. Solid (strongest) top-left, two outlines, a dashed cell (weakest) bottom-right. */
  #steelman-study .sm-logo { display:block; height:24px; width:auto; color:var(--sm-ink); flex:none; }
  #steelman-study .sm-surface { background-color:var(--sm-paper); background-image:var(--sm-canvas-image); background-size:var(--sm-canvas-size); }
  #steelman-study .sm-scene { position:relative; padding:30px 28px 24px; isolation:isolate; }
  #steelman-study .sm-links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:visible; }
  #steelman-study .sm-links path { fill:none; stroke:var(--sm-wire); stroke-width:1.3; stroke-linejoin:round; }
  #steelman-study .sm-links circle { fill:var(--sm-card); stroke:var(--sm-wire); stroke-width:1.2; }
  #steelman-study .sm-head { position:relative; z-index:1; width:86%; margin:0 auto; padding:22px 25px 24px; background:var(--sm-grain) var(--sm-card); border:1px solid var(--sm-line); border-top:3px solid var(--sm-ink); border-radius:8px; box-shadow:0 2px 3px #00000005,0 8px 18px #00000005; }
  #steelman-study h1 { font:700 32px/1.16 var(--sm-serif); letter-spacing:-.8px; margin:0; text-wrap:balance; }
  /* Two option columns with the shared importance axis between them. Opening a stack widens its column. */
  #steelman-study .sm-board { display:grid; grid-template-columns:minmax(0,1fr) 32px minmax(0,1fr); padding-top:56px; }
  #steelman-study .sm-board[data-open=&quot;open&quot;] { grid-template-columns:minmax(0,2.6fr) 32px minmax(0,1fr); }
  #steelman-study .sm-board[data-open=&quot;keep&quot;] { grid-template-columns:minmax(0,1fr) 32px minmax(0,2.6fr); }
  /* The importance axis runs down the left column&#x27;s left edge, mirroring the articulation axis above an unfolded row. */
  #steelman-study .sm-column[data-option=&quot;open&quot;] { padding-left:40px; }
  #steelman-study .sm-col-vaxis { position:absolute; left:12px; top:100px; bottom:20px; width:16px; display:flex; justify-content:center; z-index:1; }
  /* Per-column hex texture: cell size = importance, darkness = articulation. Drawn by drawTexture(). */
  #steelman-study .sm-column &gt; .sm-texture { position:absolute; left:0; top:17px; width:100%; height:calc(100% - 17px); border-radius:12px; z-index:0; pointer-events:none; }
  #steelman-study .sm-column { min-width:0; position:relative; padding:0 12px 16px; }
  #steelman-study .sm-column::before { content:&quot;&quot;; position:absolute; inset:17px 0 0; border:1px solid var(--sm-line); border-radius:12px; background:var(--sm-grain) var(--sm-panel); box-shadow:var(--sm-shadow-panel); z-index:-1; }
  #steelman-study .sm-column-head { position:relative; z-index:1; display:flex; align-items:center; min-height:58px; padding:15px 18px; background:var(--sm-grain) var(--sm-card); border:1px solid var(--sm-line); border-top:2px solid var(--sm-ink); border-radius:7px; margin-bottom:28px; }
  /* Inverted headers: near-black boxes with white serif type for the question and the options. */
  #steelman-study .sm-head, #steelman-study .sm-column-head { background:var(--sm-ink); color:#fff; border-color:var(--sm-ink); box-shadow:var(--sm-shadow-lg); }
  #steelman-study .sm-column-head h2 { font:600 19px/1.3 var(--sm-serif); letter-spacing:-.3px; }
  #steelman-study .sm-col-axis { display:none; }
  #steelman-study h2 { font-size:17px; line-height:1.4; font-weight:600; letter-spacing:-.3px; margin:0; }
  #steelman-study .sm-idea { display:grid; grid-template-columns:32px minmax(0,1fr); gap:8px; margin-bottom:24px; align-items:start; position:relative; z-index:1; }
  #steelman-study .sm-idea:last-child { margin-bottom:0; }
  #steelman-study .sm-idea &gt; .sm-vote { margin-top:12px; justify-self:center; }

  /* Axis: hairline with swept arrowheads and light lowercase italic labels at each end. */
  #steelman-study .sm-axis { display:flex; align-items:center; gap:10px; color:var(--sm-axis); font:italic 300 13px/1 var(--sm-serif); letter-spacing:.01em; text-transform:lowercase; white-space:nowrap; min-width:0; }
  #steelman-study .sm-axis-line { position:relative; flex:1; height:1px; min-width:24px; background:var(--sm-axis-line); }
  #steelman-study .sm-axis-head { position:absolute; width:12px; height:8px; color:var(--sm-axis-line); overflow:visible; }
  #steelman-study .sm-axis-head path { fill:none; stroke:currentColor; stroke-width:1; stroke-linecap:round; }
  #steelman-study .sm-axis[data-axis=&quot;h&quot;] .sm-axis-head { top:-3.5px; left:-1px; }
  #steelman-study .sm-axis[data-axis=&quot;h&quot;] .sm-axis-head + .sm-axis-head { left:auto; right:-1px; transform:scaleX(-1); }
  #steelman-study .sm-axis[data-axis=&quot;v&quot;] { flex-direction:column; height:100%; gap:12px; }
  #steelman-study .sm-axis[data-axis=&quot;v&quot;] .sm-axis-line { width:1px; min-width:0; height:auto; min-height:24px; }
  #steelman-study .sm-axis[data-axis=&quot;v&quot;] .sm-axis-head { top:1px; left:-5.5px; transform:rotate(90deg); }
  #steelman-study .sm-axis[data-axis=&quot;v&quot;] .sm-axis-head + .sm-axis-head { top:auto; bottom:1px; transform:rotate(-90deg); }
  #steelman-study .sm-axis[data-axis=&quot;v&quot;] .sm-axis-label { writing-mode:vertical-rl; transform:rotate(180deg); }
  /* Map-style halos: labels, line, and arrowheads knock out whatever texture sits behind them. */
  #steelman-study .sm-axis-label { font-weight:400; color:#444; text-shadow:0 0 2px var(--sm-panel),0 0 2px var(--sm-panel),0 0 3px var(--sm-panel),0 0 5px var(--sm-panel); }
  #steelman-study .sm-axis-line { box-shadow:0 0 0 2.5px var(--sm-panel); }
  #steelman-study .sm-axis-head { filter:drop-shadow(0 0 1.5px var(--sm-panel)) drop-shadow(0 0 1.5px var(--sm-panel)); }

  /* One vote component for both axes. The horizontal one is the same element turned a quarter turn. */

        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
