<style>

  #steelman-study .sm-column::before { content:""; position:absolute; inset:17px 0 0; border:1px solid var(--sm-line); border-radius:10px; background:var(--sm-grain) var(--sm-panel); box-shadow:var(--sm-shadow-panel); z-index:-1; }
  #steelman-study .sm-column-head { position:relative; z-index:1; display:flex; align-items:center; min-height:58px; padding:15px 18px; background:var(--sm-grain) var(--sm-card); border:1px solid var(--sm-line); border-top:2px solid var(--sm-ink); border-radius:6px; margin-bottom:28px; }

  /* Activity: everything people have done on the board, added up (importance, articulation, evidence, comments). */

  #steelman-study .sm-post:hover .sm-thumb { transform:translateY(-2px); box-shadow:var(--sm-shadow-sm); }
  #steelman-study .sm-post-options { display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:0; list-style:none; }

  #steelman-study .sm-help { padding:2px 9px 2px 7px; border:1px dashed #8a8a8a; border-radius:999px; color:var(--sm-ink); }

    if(event.key==='Enter'&&event.target.id?.startsWith('sm-auth-')){event.preventDefault();root.querySelector('[data-key="invite-auth"]')?.click();return;}
    if(event.key==='Escape'&&state.inbox){event.preventDefault();state.inbox=false;renderSite();root.querySelector('[data-key="inbox"]')?.focus();announce('Notifications closed.');save();return;}
    if(event.key==='Enter'&&event.target.id==='sm-space-invite'){event.preventDefault();root.querySelector('[data-key="space-invite-send"]')?.click();return;}
    if(event.key==='Enter'&&event.target.id==='sm-space-name'&&state.spaceEdit==='new'){event.preventDefault();root.querySelector('[data-key="space-create"]')?.click();return;}
    if(event.key==='Escape'&&!busy&&state.view==='home'&&state.spaceEdit&&!state.profile&&!state.creating){event.preventDefault();root.querySelector('[data-key="space-back"]')?.click();return;}
    if(event.key==='Escape'&&!busy&&state.view==='home'&&state.profile){event.preventDefault();root.querySelector(`[data-key="${state.pwOpen?'pw-cancel':'profile-back'}"]`)?.click();return;}
    if(event.key!=='Escape'||busy||state.view!=='board')return;
    if(state.share){event.preventDefault();state.share=false;state.shareQuery='';render('share');announce('Sharing closed.');return;}
    if(state.menu){event.preventDefault();const id=state.menu;closeMenu();root.querySelector(`[data-key="menu-${id}"]`)?.focus();return;}
    if(state.replyTo){event.preventDefault();const id=state.replyTo;state.replyTo=null;render('reply-'+id);return;}
    if(state.drawer){event.preventDefault();render(closeDrawer());save();return;}
    if(state.moving){event.preventDefault();const card=state.moving;state.moving=null;render('menu-'+card);announce('Move cancelled.');return;}
    if(state.sourceForm){event.preventDefault();const {card,source}=state.sourceForm;state.sourceForm=null;state.sourceDraft={};render(source?`src-${card}/${source}`:'add-source-'+card);announce('Source form closed.');return;}
    if(state.editing){event.preventDefault();const id=state.editing;state.editing=null;render('menu-'+id);announce('Changes discarded.');return;}
    if(state.composingIdea){event.preventDefault();const option=state.composingIdea;state.composingIdea=null;render('compose-idea-'+option);save();announce('Draft kept for later.');return;}
    if(state.composing){event.preventDefault();state.composing=false;const id=state.open;if(ideaOf(id).versions.length===1){fold(id);return;}render('compose-'+id);save();return;}
    if(state.expanded){event.preventDefault();collapse(state.expanded);return;}
    if(state.open){event.preventDefault();fold(state.open);return;}
    // With nothing open, Escape steps back: Strongest case → Board → the list.
    event.preventDefault();
    if(state.zoom==='case') zoomTo('read');
    else root.querySelector('[data-key="crumb-space"]')?.click();
  });
  root.addEventListener('click',event=>{
    const summary=event.target.closest('.sm-source-row summary');if(!summary)return;
    const detail=summary.parentElement;
    requestAnimationFrame(()=>{state.openSources ||= {};state.openSources[detail.dataset.sourceKey]=detail.open;animateWires();save();});
  });
  scrimEl.addEventListener('click',()=>root.querySelector('[data-key="create-close"]')?.click());
  // Phone carousel: the caption and dots follow the version in view.
  root.addEventListener('scroll',event=>{
    const t=event.target;if(!t.classList?.contains('sm-track'))return;
    const row=t.closest('.sm-idea'),pager=row?.querySelector('.sm-pager');if(!pager||getComputedStyle(pager).display==='none')return;
    const faces=[...t.querySelectorAll(':scope > .sm-card, :scope > .sm-add-card, :scope > form')],x=t.getBoundingClientRect().left;
    let i=0,best=Infinity;faces.forEach((f,k)=>{const d=Math.abs(f.getBoundingClientRect().left-x-14);if(d<best){best=d;i=k;}});
    const n=pager.querySelectorAll('.sm-pager-dots i').length;
    pager.querySelector('.sm-pager-text').textContent=i>=n?'Add a better version':`${i+1} of ${n}${i===0?' · '+pager.dataset.first:i===n-1&&n>1?' · '+pager.dataset.last:''}`;
    pager.querySelectorAll('.sm-pager-dots i').forEach((d,k)=>d.toggleAttribute('data-on',k===i));
  },true);
  // A click outside the comments or settings panel closes it (buttons that open or switch it keep working).
  root.addEventListener('click',event=>{
    if(state.view!=='board'||!state.drawer||event.target.closest('.sm-drawer,[data-action="comments"],[data-action="settings"],[data-action="open-share"],.sm-menu'))return;
    // Close now, but let the click still reach what it was aimed at; redraw right after.
    closeDrawer();setTimeout(()=>{render();save();});
  },true);
  // A click outside the inbox closes it (the bell toggles it itself).
  root.addEventListener('click',event=>{
    if(!state.inbox||event.target.closest('.sm-inbox,[data-key="inbox"]'))return;
    state.inbox=false;renderSite();if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
  },true);
  // A click outside the share panel closes it (the Share button toggles it itself).
  root.addEventListener('click',event=>{
    if(!state.share||event.target.closest('.sm-share,[data-key="share"]'))return;
    state.share=false;state.shareQuery='';renderSite();renderShare();if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
  },true);
  // A click outside the open spaces menu closes it.
  root.addEventListener('click',event=>{
    if(!state.navOpen||event.target.closest('.sm-side,[data-key="nav-toggle"]'))return;
    state.navOpen=false;renderSite();if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});event.stopPropagation();
  },true);
  // Clicking anywhere on a list item opens its board, except on its own controls.
  root.addEventListener('click',event=>{
    const item=event.target.closest('.sm-post');if(!item||event.target.closest('button,a,input'))return;
    homeAction('open-board',item.dataset.board,item);save();
  });
  // Drag to combine: the merge handle in a card's footer. Other rows in the same option light up as targets; for a version
  // in a row with several wordings, the column's "Add an argument" slot becomes "Make it a separate argument".
  // The board is not re-rendered while dragging, so the drag isn't interrupted. Touch screens use the handle's click instead.
  let dragCard=null;
  function endDrag() {
    dragCard=null;root.removeAttribute('data-dragging');
    board.querySelectorAll('.sm-drop-target,.sm-drag-source').forEach(n=>{n.classList.remove('sm-drop-target','sm-drop-over','sm-drop-split','sm-drag-source');delete n.dataset.dropLabel;});
  }
  root.addEventListener('dragstart',event=>{
    const handle=event.target.closest?.('[data-drag]');if(!handle||!cards[handle.dataset.drag])return;
    dragCard=handle.dataset.drag;closeMenu();
    event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',dragCard);
    const face=handle.closest('.sm-card');if(face)event.dataTransfer.setDragImage(face,30,20);
    const from=ideaOf(cards[dragCard].idea),direct=canMove(dragCard);
    root.setAttribute('data-dragging','');
    board.querySelector(`[data-node="${from.id}"]`)?.classList.add('sm-drag-source');
    board.querySelectorAll('.sm-idea[data-node]').forEach(n=>{const i=ideaOf(n.dataset.node);if(i&&i.option===from.option&&i.id!==from.id){n.classList.add('sm-drop-target');n.dataset.dropLabel=direct?'Combine here':'Suggest combining here';}});
    if(direct&&from.versions.length>1){const slot=board.querySelector(`.sm-column[data-option="${from.option}"] .sm-new-idea`);if(slot){slot.classList.add('sm-drop-target','sm-drop-split');slot.dataset.dropLabel='Make it a separate argument';}}
    announce(direct?'Dragging. Drop it on the argument it makes the same point as.':'Dragging. Drop it on an argument to suggest combining them.');
  });
  root.addEventListener('dragover',event=>{
    if(!dragCard)return;
    const t=event.target.closest?.('.sm-drop-target');
    board.querySelectorAll('.sm-drop-over').forEach(n=>{if(n!==t)n.classList.remove('sm-drop-over');});
    if(!t)return;
    event.preventDefault();event.dataTransfer.dropEffect='move';t.classList.add('sm-drop-over');
  });
  root.addEventListener('drop',event=>{
    if(!dragCard)return;
    const t=event.target.closest?.('.sm-drop-target');if(!t)return;
    event.preventDefault();const card=dragCard,split=t.classList.contains('sm-drop-split');endDrag();
    report(split?'drag-separate':'drag-combine',{board:state.boardId,id:card});
    if(split){splitVersion(card);render('undo','reorder');save();announce('Separated into a new argument at the bottom of this option. Undo is available for ten seconds.');return;}
    const r=combine(card,t.dataset.node);render(r.focus,r.motion);save();
  });
  root.addEventListener('dragend',endDrag);
  restore(window.openai?.widgetState);
  if(!readInviteLink()) renderView();
  try { hostWindow().addEventListener('hashchange',()=>{if(readInviteLink())save();}); } catch {}
  window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState;if(incoming&&JSON.stringify(incoming.privateContent)!==lastSavedSnapshot){restore(incoming);renderView();}});
  new ResizeObserver(()=>animateWires()).observe(scene);
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>render()});tweak.addSelect(design,'type',{label:'Argument typography',options:[{label:'Graphics sans',value:'sans'},{label:'Editorial serif',value:'serif'}]});tweak.addSelect(design,'density',{label:'Card density',options:[{label:'Comfortable',value:'comfortable'},{label:'Compact',value:'compact'}]});}
})();
</script>
