<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,300&display=swap');
  /* @tokens: docs/design/tokens.css is inserted here by scripts/sync-prototype.py */
  #steelman-study {
    font-family:var(--sm-sans); color:var(--sm-ink); color-scheme:light; background:transparent;
  }
  #steelman-study * { box-sizing:border-box; }
  #steelman-study button, #steelman-study textarea { font:inherit; color:inherit; }
  #steelman-study button { -webkit-tap-highlight-color:transparent; cursor:pointer; }
  #steelman-study button:disabled { opacity:.45; cursor:default; }
  #steelman-study :is(button,textarea,summary,[tabindex]):focus-visible { outline:2px solid var(--sm-ink); outline-offset:3px; }
  #steelman-study button svg { flex:none; }
  #steelman-study .sm-site { display:flex; align-items:center; min-height:56px; padding:10px 22px; background:#fff; border-bottom:1px solid var(--sm-ink); }
  #steelman-study .sm-wordmark { display:flex; align-items:center; gap:8px; font:700 23px var(--sm-serif); letter-spacing:-1px; }
  /* Logo: honeycomb diamond. Solid (strongest) top-left, two outlines, a dashed cell (weakest) bottom-right. */
  #steelman-study .sm-logo { display:block; height:24px; width:auto; color:var(--sm-ink); flex:none; }
  #steelman-study .sm-surface { background-color:var(--sm-paper); background-image:var(--sm-canvas-image); background-size:var(--sm-canvas-size); }
  #steelman-study .sm-scene { position:relative; padding:30px 28px 24px; isolation:isolate; }
  #steelman-study .sm-links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:visible; }
  #steelman-study .sm-links path { fill:none; stroke:var(--sm-wire); stroke-width:1.3; stroke-linejoin:round; }
  #steelman-study .sm-links circle { fill:var(--sm-card); stroke:var(--sm-wire); stroke-width:1.2; }
  #steelman-study .sm-head { position:relative; z-index:1; width:86%; margin:0 auto; padding:22px 25px 24px; background:var(--sm-grain) var(--sm-card); border:1px solid var(--sm-line); border-top:3px solid var(--sm-ink); border-radius:8px; box-shadow:0 2px 3px #00000005,0 8px 18px #00000005; }
  #steelman-study h1 { font:700 32px/1.16 var(--sm-serif); letter-spacing:-.8px; margin:0; text-wrap:balance; }
  /* Question details: quiet, light type under the title, with tools in the top-right corner. */
  #steelman-study .sm-head { padding-right:62px; }
  #steelman-study .sm-head :focus-visible { outline-color:#fff; }
  #steelman-study .sm-head-tools { position:absolute; top:12px; right:12px; display:flex; gap:2px; }
  #steelman-study .sm-head-button { display:grid; place-items:center; width:32px; height:32px; padding:0; border:0; border-radius:6px; background:transparent; color:#ffffff8c; }
  #steelman-study .sm-head-button:hover, #steelman-study .sm-head-button[aria-expanded="true"] { background:#ffffff1f; color:#fff; }
  #steelman-study .sm-head-button svg { width:17px; height:17px; stroke-width:1.6; }
  #steelman-study .sm-head-button.sm-comment-button { display:inline-flex; align-items:center; justify-content:center; gap:4px; width:auto; min-width:32px; padding:0 7px; }
  #steelman-study .sm-column-head .sm-head-button { margin:-6px -8px -6px auto; flex:none; }
  #steelman-study .sm-comment-count { font:500 12px/1 var(--sm-sans); font-variant-numeric:tabular-nums; }
  #steelman-study .sm-source-button.sm-comment-button svg { width:13px; height:13px; }
  /* What the open comments are about: a ring around that question, option, or version. */
  #steelman-study .sm-head.sm-commenting, #steelman-study .sm-column-head.sm-commenting { outline:2px solid var(--sm-ink); outline-offset:3px; }
  #steelman-study .sm-card.sm-commenting, #steelman-study .sm-card.sm-commenting:hover { border-color:var(--sm-ink); box-shadow:0 0 0 1px var(--sm-ink),var(--sm-shadow); }
  #steelman-study .sm-question-meta { display:flex; flex-wrap:wrap; align-items:center; gap:4px 0; margin:12px 0 0; padding:0; list-style:none; font:300 12px/1.4 var(--sm-sans); letter-spacing:.01em; color:#ffffff99; }
  #steelman-study .sm-question-meta li { display:inline-flex; align-items:center; gap:4px; }
  #steelman-study .sm-question-meta li + li::before { content:"·"; margin:0 8px; opacity:.7; }
  #steelman-study .sm-question-meta svg { width:12px; height:12px; stroke-width:1.6; }

  /* Right-hand panel for settings and comments. Non-modal: the board stays usable beside it.
     The standalone page grows its frame to fit the content, so the panel can't be pinned to the screen;
     positionDrawer() anchors it level with what it is about instead, like margin comments. */
  #steelman-study { position:relative; }
  #steelman-study .sm-drawer { position:absolute; top:0; right:12px; width:356px; z-index:30; display:flex; flex-direction:column; background:var(--sm-card); border:1px solid var(--sm-line); border-radius:10px; box-shadow:var(--sm-shadow-lg),0 12px 32px #0000001f; }
  /* Wide screens make room beside the board. Narrower ones float the panel over the board without moving it,
     on the side away from what it is about (data-side), so that item stays visible. */
  @media(min-width:1200px) { #steelman-study[data-drawer] { padding-right:380px; } }
  @media(max-width:1199px) { #steelman-study .sm-drawer[data-side="left"] { right:auto; left:12px; } }
  #steelman-study .sm-drawer-head { border-radius:10px 10px 0 0; display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:56px; padding:10px 12px 10px 20px; background:var(--sm-card); border-bottom:1px solid var(--sm-line); }
  #steelman-study .sm-drawer-head h2 { font:600 18px/1.3 var(--sm-serif); }
  #steelman-study .sm-drawer-body { display:grid; gap:24px; padding:20px 20px 28px; }
  #steelman-study .sm-field { display:grid; gap:8px; min-width:0; margin:0; padding:0; border:0; }
  #steelman-study .sm-field > label, #steelman-study .sm-field > legend { padding:0; font-size:12px; font-weight:600; }
  #steelman-study .sm-field-hint { margin:0; font-size:11px; line-height:1.5; color:var(--sm-muted); }
  #steelman-study .sm-drawer :is(textarea,select) { width:100%; border:1px solid #c8c8c8; border-radius:6px; background:#fff; padding:8px 10px; font-size:14px; line-height:1.45; }
  #steelman-study .sm-drawer textarea { resize:vertical; min-height:64px; font-family:var(--sm-serif); font-size:16px; }
  #steelman-study .sm-drawer :is(textarea,select):focus-visible { outline:2px solid var(--sm-ink); outline-offset:1px; }
  #steelman-study .sm-drawer textarea[aria-invalid="true"] { border-color:var(--sm-cred-weak); box-shadow:inset 3px 0 0 var(--sm-cred-weak); }
  #steelman-study .sm-choices { display:grid; gap:6px; }
  #steelman-study .sm-choice { display:grid; grid-template-columns:16px 18px minmax(0,1fr); align-items:center; gap:2px 8px; padding:9px 11px; border:1px solid var(--sm-line); border-radius:7px; font-size:13px; cursor:pointer; }
  #steelman-study .sm-choice input { margin:0; accent-color:var(--sm-ink); }
  #steelman-study .sm-choice svg { width:15px; height:15px; color:var(--sm-muted); }
  #steelman-study .sm-choice small { grid-column:3; font-size:11px; line-height:1.45; color:var(--sm-muted); }
  #steelman-study .sm-choice:hover { border-color:#aaa; }
  #steelman-study .sm-choice:has(input:checked) { border-color:var(--sm-ink); background:var(--sm-soft); }
  #steelman-study .sm-choice:has(input:disabled) { opacity:.5; cursor:default; }
  #steelman-study .sm-choice:has(input:focus-visible) { outline:2px solid var(--sm-ink); outline-offset:2px; }
  #steelman-study .sm-drawer-section { display:grid; gap:10px; padding-top:20px; border-top:1px solid var(--sm-line); }
  #steelman-study .sm-drawer-section h3 { margin:0; font-size:12px; font-weight:600; }
  #steelman-study .sm-button.sm-solid { background:var(--sm-selected); color:var(--sm-on-selected); border-color:var(--sm-selected); }
  #steelman-study .sm-comments-body { flex:1; align-content:start; gap:14px; }
  #steelman-study .sm-comment-target { margin:0 0 4px; padding:10px 12px; border-left:3px solid var(--sm-ink); background:var(--sm-soft); border-radius:0 6px 6px 0; }
  #steelman-study .sm-comment-target span { font-size:11px; font-weight:600; color:var(--sm-muted); }
  #steelman-study .sm-comment-target p { margin:4px 0 0; font:400 14px/1.45 var(--sm-serif); }
  #steelman-study .sm-thread { display:grid; gap:10px; padding:12px; border:1px solid var(--sm-line); border-radius:8px; }
  #steelman-study .sm-thread.sm-resolved { opacity:.7; border-style:dashed; }
  #steelman-study .sm-comment header { display:flex; align-items:center; gap:7px; font-size:12px; }
  #steelman-study .sm-comment time { color:var(--sm-muted); font-size:11px; }
  #steelman-study .sm-avatar { display:grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--sm-ink); color:#fff; font-size:11px; font-weight:600; flex:none; }
  #steelman-study .sm-comment p { margin:6px 0 0 29px; font-size:13px; line-height:1.55; overflow-wrap:anywhere; }
  #steelman-study .sm-comment .sm-comment-deleted { color:var(--sm-muted); font-style:italic; }
  #steelman-study .sm-reply { margin-left:14px; padding-left:12px; border-left:1px solid var(--sm-line); }
  #steelman-study .sm-comment-actions { display:flex; gap:12px; margin:6px 0 0 29px; }
  #steelman-study .sm-link-button { border:0; background:transparent; padding:2px 0; font-size:11px; font-weight:500; color:var(--sm-muted); }
  #steelman-study .sm-link-button:hover { color:var(--sm-ink); text-decoration:underline; }
  #steelman-study .sm-reply-form { display:grid; gap:8px; margin-left:14px; }
  #steelman-study .sm-comment-compose { display:grid; border-radius:0 0 10px 10px; gap:8px; padding:12px 20px 16px; background:var(--sm-card); border-top:1px solid var(--sm-line); }
  #steelman-study .sm-drawer :is(.sm-comment-compose,.sm-reply-form) textarea { min-height:0; font:400 13px/1.5 var(--sm-sans); }
  #steelman-study .sm-comment-form-actions { display:flex; align-items:center; justify-content:flex-end; gap:12px; }
  #steelman-study .sm-button[data-armed] { border-color:var(--sm-cred-weak); color:var(--sm-cred-weak); }
  /* Two option columns with the shared importance axis between them. Opening a stack widens its column. */
  #steelman-study .sm-board { display:grid; grid-template-columns:minmax(0,1fr) 32px minmax(0,1fr); padding-top:56px; }
  #steelman-study .sm-board[data-open="open"] { grid-template-columns:minmax(0,2.6fr) 32px minmax(0,1fr); }
  #steelman-study .sm-board[data-open="keep"] { grid-template-columns:minmax(0,1fr) 32px minmax(0,2.6fr); }
  /* The importance axis runs down the left column's left edge, mirroring the articulation axis above an unfolded row. */
  #steelman-study .sm-column[data-option="open"] { padding-left:40px; }
  #steelman-study .sm-col-vaxis { position:absolute; left:12px; top:100px; bottom:20px; width:16px; display:flex; justify-content:center; z-index:1; }
  /* Per-column hex texture: cell size = importance, darkness = articulation. Drawn by drawTexture(). */
  #steelman-study .sm-column > .sm-texture { position:absolute; left:0; top:17px; width:100%; height:calc(100% - 17px); border-radius:12px; z-index:0; pointer-events:none; }
  #steelman-study .sm-column { min-width:0; position:relative; padding:0 12px 16px; }
  #steelman-study .sm-column::before { content:""; position:absolute; inset:17px 0 0; border:1px solid var(--sm-line); border-radius:12px; background:var(--sm-grain) var(--sm-panel); box-shadow:var(--sm-shadow-panel); z-index:-1; }
  #steelman-study .sm-column-head { position:relative; z-index:1; display:flex; align-items:center; min-height:58px; padding:15px 18px; background:var(--sm-grain) var(--sm-card); border:1px solid var(--sm-line); border-top:2px solid var(--sm-ink); border-radius:7px; margin-bottom:28px; }
  /* Inverted headers: near-black boxes with white serif type for the question and the options. */
  #steelman-study .sm-head, #steelman-study .sm-column-head { background:var(--sm-ink); color:#fff; border-color:var(--sm-ink); box-shadow:var(--sm-shadow-lg); }
  #steelman-study .sm-column-head h2 { font:600 19px/1.3 var(--sm-serif); letter-spacing:-.3px; }
  #steelman-study .sm-col-axis { display:none; }
  #steelman-study h2 { font-size:17px; line-height:1.4; font-weight:600; letter-spacing:-.3px; margin:0; }
  #steelman-study .sm-idea { display:grid; grid-template-columns:32px minmax(0,1fr); gap:8px; margin-bottom:24px; align-items:start; position:relative; z-index:1; }
  #steelman-study .sm-idea > .sm-vote { margin-top:12px; justify-self:center; }

  /* Axis: hairline with swept arrowheads and light lowercase italic labels at each end. */
  #steelman-study .sm-axis { display:flex; align-items:center; gap:10px; color:var(--sm-axis); font:italic 300 13px/1 var(--sm-serif); letter-spacing:.01em; text-transform:lowercase; white-space:nowrap; min-width:0; }
  #steelman-study .sm-axis-line { position:relative; flex:1; height:1px; min-width:24px; background:var(--sm-axis-line); }
  #steelman-study .sm-axis-head { position:absolute; width:12px; height:8px; color:var(--sm-axis-line); overflow:visible; }
  #steelman-study .sm-axis-head path { fill:none; stroke:currentColor; stroke-width:1; stroke-linecap:round; }
  #steelman-study .sm-axis[data-axis="h"] .sm-axis-head { top:-3.5px; left:-1px; }
  #steelman-study .sm-axis[data-axis="h"] .sm-axis-head + .sm-axis-head { left:auto; right:-1px; transform:scaleX(-1); }
  #steelman-study .sm-axis[data-axis="v"] { flex-direction:column; height:100%; gap:12px; }
  #steelman-study .sm-axis[data-axis="v"] .sm-axis-line { width:1px; min-width:0; height:auto; min-height:24px; }
  #steelman-study .sm-axis[data-axis="v"] .sm-axis-head { top:1px; left:-5.5px; transform:rotate(90deg); }
  #steelman-study .sm-axis[data-axis="v"] .sm-axis-head + .sm-axis-head { top:auto; bottom:1px; transform:rotate(-90deg); }
  #steelman-study .sm-axis[data-axis="v"] .sm-axis-label { writing-mode:vertical-rl; transform:rotate(180deg); }
  /* Map-style halos: labels, line, and arrowheads knock out whatever texture sits behind them. */
  #steelman-study .sm-axis-label { font-weight:400; color:#444; text-shadow:0 0 2px var(--sm-panel),0 0 2px var(--sm-panel),0 0 3px var(--sm-panel),0 0 5px var(--sm-panel); }
  #steelman-study .sm-axis-line { box-shadow:0 0 0 2.5px var(--sm-panel); }
  #steelman-study .sm-axis-head { filter:drop-shadow(0 0 1.5px var(--sm-panel)) drop-shadow(0 0 1.5px var(--sm-panel)); }

  /* One vote component for both axes. The horizontal one is the same element turned a quarter turn. */
  #steelman-study .sm-vote { display:inline-flex; flex-direction:column; align-items:center; border:1px solid #c8c8c8; border-radius:7px; padding:2px; background:var(--sm-card); color:var(--sm-muted); box-shadow:var(--sm-shadow-sm); }
  #steelman-study .sm-vote[data-axis="h"] { flex-direction:row; }
  #steelman-study .sm-vote[data-axis="h"] .sm-vote-btn svg { transform:rotate(-90deg); }
  #steelman-study .sm-vote-btn { display:grid; place-items:center; border:0; border-radius:5px; background:transparent; padding:4px; width:25px; height:25px; }
  #steelman-study .sm-vote-btn:hover { background:var(--sm-soft); color:var(--sm-ink); }
  #steelman-study .sm-vote-btn[aria-pressed="true"] { background:var(--sm-selected); color:var(--sm-on-selected); }
  #steelman-study .sm-vote-score { display:grid; place-items:center; min-width:24px; min-height:20px; font-size:11px; font-weight:500; font-variant-numeric:tabular-nums; }

  #steelman-study .sm-card-wrap { min-width:0; position:relative; padding-right:24px; }
  #steelman-study .sm-open .sm-card-wrap { padding-right:0; }
  /* The same face, type, and footer are used on the board and in an unfolded row. */
  #steelman-study .sm-card { position:relative; z-index:2; border:1px solid #c8c8c8; border-radius:11px; background-color:var(--sm-card); background-image:var(--sm-grain); box-shadow:var(--sm-shadow),inset 0 1px 0 #fff; transition:box-shadow 180ms ease,border-color 180ms ease; min-width:0; }
  #steelman-study .sm-card:hover { border-color:#aaa; box-shadow:var(--sm-shadow-hover),inset 0 1px 0 #fff; }
  #steelman-study .sm-claim-button { display:block; width:100%; text-align:left; border:0; padding:18px; background:transparent; border-radius:10px 10px 0 0; }
  #steelman-study .sm-claim { display:block; font:400 16px/1.5 var(--sm-sans); letter-spacing:-.15px; margin:0; overflow-wrap:anywhere; }
  /* Narrow cards (a squeezed column) drop the secondary footer text; the meter and tooltip keep the meaning. */
  #steelman-study .sm-card { container-type:inline-size; }
  @container (max-width:250px) { #steelman-study .sm-card-meta :is(.sm-count,.sm-unreviewed-copy) { display:none; } }
  @container (max-width:190px) { #steelman-study .sm-card-meta .sm-cred-copy { display:none; } }
  #steelman-study .sm-card-meta { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:4px 9px; border-top:1px solid var(--sm-line); min-height:39px; }
  #steelman-study .sm-card-tools { display:flex; align-items:center; gap:6px; flex:none; }
  #steelman-study .sm-cred { overflow:hidden; display:flex; align-items:center; gap:7px; background:transparent; border:0; padding:3px; border-radius:5px; font-size:11px; text-align:left; min-width:0; min-height:28px; }
  #steelman-study .sm-cred:hover, #steelman-study .sm-source-button:hover, #steelman-study .sm-expand:hover { background:var(--sm-soft); }
  #steelman-study .sm-cred-copy { display:flex; align-items:baseline; column-gap:5px; row-gap:2px; flex-wrap:wrap; }
  #steelman-study .sm-percentage { font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; }
  #steelman-study .sm-count { color:var(--sm-muted); font-size:11px; white-space:nowrap; }
  #steelman-study .sm-few { border-bottom:1px dotted var(--sm-muted); }
  #steelman-study .sm-evidence-symbol { display:grid; place-items:center; position:relative; width:17px; height:18px; flex:none; color:var(--sm-ink); }
  #steelman-study .sm-evidence-symbol svg { width:16px; height:16px; stroke-width:1.6; }
  #steelman-study .sm-evidence-symbol.sm-unreviewed { color:var(--sm-muted); }
  #steelman-study .sm-evidence-symbol .sm-stamp { position:absolute; bottom:-1px; right:-3px; background:var(--sm-card); border-radius:50%; width:12px; height:12px; }
  #steelman-study .sm-evidence-symbol .sm-stamp svg { width:12px; height:12px; stroke-width:2.3; }
  #steelman-study .sm-source-button { display:flex; align-items:center; justify-content:center; gap:4px; border:0; background:transparent; padding:5px; min-height:28px; border-radius:5px; font-size:11px; color:var(--sm-muted); }
  #steelman-study .sm-source-button svg { width:13px; height:13px; }
  #steelman-study .sm-expand { display:grid; place-items:center; width:30px; height:28px; padding:6px; border:0; border-left:1px solid var(--sm-line); border-radius:0 4px 4px 0; background:transparent; }
  #steelman-study .sm-expand svg { width:16px; height:16px; stroke-width:1.8; }
  #steelman-study .sm-expanded { border-color:#929292; box-shadow:0 2px 4px #0000000d,0 18px 32px #00000020; }

  /* Paper stack: one edge per hidden version (up to three). A dashed edge means no other version yet. */
  #steelman-study .sm-stack-button { position:absolute; top:0; bottom:0; right:0; width:40px; padding:0; border:0; background:transparent; z-index:1; border-radius:8px; }
  #steelman-study .sm-stack-button span { position:absolute; width:30px; border:1px solid var(--sm-line); background:var(--sm-grain) #f8f8f8; border-radius:9px; pointer-events:none; transition:transform 180ms ease; box-shadow:2px 2px 5px #00000006; }
  #steelman-study .sm-stack-button.sm-empty span { border-style:dashed; border-color:#bdbdbd; background:transparent; box-shadow:none; }
  #steelman-study .sm-stack-button:hover span { transform:translateX(3px); }

  /* Unfolded row: cards on top, articulation votes on the axis beneath them. */
  #steelman-study .sm-track { display:grid; grid-template-rows:auto auto; grid-auto-flow:column; grid-auto-columns:calc((100% - 36px - 44px) / 3); gap:10px 18px; align-items:start; overflow-x:auto; overscroll-behavior-x:contain; padding:4px 14px 22px; margin:-4px -14px -18px; scrollbar-width:thin; scrollbar-color:#999 transparent; scroll-padding:2px; }
  #steelman-study .sm-version-vote { justify-self:center; }
  #steelman-study .sm-idea.sm-open { row-gap:0; }
  #steelman-study .sm-open > .sm-track-axis { grid-column:2; grid-row:1; display:flex; align-items:center; gap:10px; height:24px; margin-bottom:10px; padding:0 2px; overflow:hidden; }
  #steelman-study .sm-open > .sm-vote { grid-column:1; grid-row:2; }
  #steelman-study .sm-open > .sm-card-wrap { grid-column:2; grid-row:2; }
  #steelman-study .sm-track-axis .sm-axis { flex:1; }
  #steelman-study .sm-fold { display:grid; place-items:center; width:24px; height:24px; padding:4px; border:1px solid #c8c8c8; border-radius:7px; background:var(--sm-card); color:var(--sm-muted); box-shadow:var(--sm-shadow-sm); }
  #steelman-study .sm-fold:hover { background:var(--sm-soft); color:var(--sm-ink); }
  #steelman-study .sm-fold svg { width:14px; height:14px; }
  #steelman-study .sm-add-card { display:grid; place-items:center; width:100%; min-height:110px; border:1px dashed #b9b9b9; border-radius:11px; background:transparent; color:#9a9a9a; }
  #steelman-study .sm-add-card:hover { border-color:var(--sm-ink); color:var(--sm-ink); background:#fafafa80; }
  #steelman-study .sm-add-card svg { width:22px; height:22px; stroke-width:1.5; }
  /* New argument: same dashed language as a new version, lined up with the cards (vote lane on the left, stack lane on the right). */

    access: {brief:'Sunday opening could serve people whose work overlaps the current schedule. The survey points to an unmet need.', idea:'access', claim:'Sunday hours would give some weekday workers their only practical time to visit.', yes:24, no:8, pref:26, sources:['survey','hours'], explanation:'The case is about access for people whose work overlaps the existing schedule. “Some” matters: the survey supports an unmet need among respondents, not every resident.'},

    accessNarrow: {brief:'This describes the survey respondents. It doesn’t tell us how common the need is across the community.', idea:'access', claim:'For 18 surveyed residents, Sunday was the only day they reported being able to visit.', yes:3, no:1, pref:4, sources:['survey'], explanation:'This version stays close to the survey result. It is precise about the sample, but leaves the reader to decide what that finding means for the wider community.'},

      lastToggled=id;state.open=id;state.composing=ideaOf(id).versions.length===1;if(state.composing)state.composingIdea=null;
      focus=state.composing?'draft':'claim-'+ordered(ideaOf(id))[0];motion='unfold';
      announce('Versions unfolded in place, best articulated first. Browsing does not cast a vote.');
    }
    if(action==='fold') {fold(id);return;}
    if(action==='settings') {state.drawer=state.drawer==='settings'?null:'settings';state.confirmReset=false;focus=state.drawer?'q-text':'settings';announce(state.drawer?'Settings opened beside the board.':'Settings closed.');}
    if(action==='close-drawer') {focus=closeDrawer();}
    if(action==='comments') {
      if(commenting(id)){focus=closeDrawer();}
      else {state.drawer='comments';state.commentTarget=id;state.replyTo=null;state.showResolved=false;state.confirmReset=false;focus='comment-text';announce(`Comments on this ${describeTarget(id).kind.toLowerCase()} opened beside the board.`);}
    }
    if(action==='comment-add') {
      const text=state.commentDraft.trim(),field=root.querySelector('#sm-comment');
      if(!text){field.setAttribute('aria-invalid','true');field.focus();announce('Write a comment first.');return;}
      doc.comments.push({id:'c'+(doc.nextId++),target:state.commentTarget,by:'you',at:new Date().toISOString(),text:text.slice(0,1000)});
      state.commentDraft='';focus='comment-text';announce('Comment added.');
    }
    if(action==='reply') {state.replyTo=id;state.replyDraft='';focus='reply-text';}
    if(action==='reply-cancel') {state.replyTo=null;state.replyDraft='';focus='reply-'+id;}
    if(action==='reply-add') {
      const text=state.replyDraft.trim(),field=root.querySelector('#sm-reply');
      if(!text){field.setAttribute('aria-invalid','true');field.focus();announce('Write a reply first.');return;}
      doc.comments.push({id:'c'+(doc.nextId++),target:state.commentTarget,parent:id,by:'you',at:new Date().toISOString(),text:text.slice(0,1000)});
      state.replyTo=null;state.replyDraft='';focus='reply-'+id;announce('Reply added.');
    }
    if(action==='resolve') {
      const c=doc.comments.find(x=>x.id===id);c.resolved=!c.resolved;if(state.replyTo===id)state.replyTo=null;
      focus=c.resolved?'comment-text':'resolve-'+id;announce(c.resolved?'Thread resolved. It is under Resolved.':'Thread reopened.');
    }
    if(action==='delete-comment') {
      const c=doc.comments.find(x=>x.id===id);
      // A first comment with replies leaves a placeholder, so the replies keep their context.
      if(!c.parent&&repliesTo(id).length) c.deleted=true; else doc.comments=doc.comments.filter(x=>x.id!==id);
      focus='comment-text';announce('Comment deleted.');
    }
    if(action==='show-resolved') {state.showResolved=!state.showResolved;}
    if(action==='reset') {
      if(!state.confirmReset){state.confirmReset=true;focus='reset';announce('Click again to reset the board, your votes, and your edits to the original example.');}
      else {state=freshState();useDoc(seedDoc());state.drawer='settings';focus='reset';announce('The example board was reset.');}
    }
    if(action==='importance') {const old=state.importance[id]||0;state.importance[id]=old===Number(vote)?0:Number(vote);announce(state.importance[id]?'Importance vote saved. The shared order stays in place.':'Importance vote withdrawn.');}
    if(action==='preference') {state.preference[id]=(state.preference[id]||0)===Number(vote)?0:Number(vote);announce(state.preference[id]?'Articulation vote saved. The shared order stays in place.':'Articulation vote withdrawn.');}
    if(action==='assess') {const value=trigger.dataset.value;state.assessments[id]=value==='skip'||state.assessments[id]===value?null:value;announce(state.assessments[id]?'Your one active assessment is included in the support percentage.':'Assessment withdrawn.');}
    if(action==='compose-idea') {state.composingIdea=id;state.composing=false;focus='idea-claim';announce(`Write a new argument for ${optionName(id)} in the empty card.`);}
    if(action==='cancel-idea') {state.composingIdea=null;focus='compose-idea-'+id;announce('Draft kept for later.');}
    if(action==='add-idea') {
      const claim=state.ideaDraftClaim.trim(),field=root.querySelector('#sm-idea-claim');
      if(!claim){field.setAttribute('aria-invalid','true');field.focus();announce('Write your argument first.');return;}
      const added=addIdea(id,claim,state.ideaDraftReason.trim());
      state.composingIdea=null;state.ideaDraftClaim='';state.ideaDraftReason='';
      state.expanded=added;focus='claim-'+added;motion='added';
      announce(`Your argument was added at the bottom of ${optionName(id)}. It starts with no importance votes, unreviewed, and with no sources.`);
    }
    if(action==='compose') {state.composingIdea=null;state.composing=true;focus='draft';announce('Write your version in the empty card.');}
    if(action==='cancel-compose') {state.composing=false;focus='compose-'+id;if(ideaOf(id).versions.length===1){fold(id);return;}announce('Draft kept for later.');}
    if(action==='add') {
      const form=root.querySelector('#sm-form'),claim=state.draftClaim.trim(),reason=state.draftReason.trim();
      if(!claim||!reason){
        form.querySelector('#sm-draft').toggleAttribute('aria-invalid',!claim);
        form.querySelector('#sm-reason').toggleAttribute('aria-invalid',!reason);
        form.querySelectorAll('[aria-invalid]').forEach(el=>el.setAttribute('aria-invalid','true'));
        form.querySelector(!claim?'#sm-draft':'#sm-reason').focus();
        announce('Add your version and what it improves.');return;
      }
      const added=addVersion(id,claim,reason);if(!added)return;
      state.composing=false;state.draftClaim='';state.draftReason='';
      state.expanded=added;focus='claim-'+state.expanded;motion='added';
      announce('Your version was added at the end of the row. It starts unreviewed, with no articulation votes.');
    }
    if(action==='reorder') {state.updated=!state.updated;motion='reorder';focus='reorder';announce(state.updated?'Example shared-order update applied. New sample importance scores move two ideas up.':'Original example order restored.');}
    render(focus,motion);save();
  });
  root.addEventListener('keydown',event=>{
    if(event.key==='Enter'&&(event.metaKey||event.ctrlKey)&&['sm-comment','sm-reply'].includes(event.target.id)){event.preventDefault();root.querySelector(event.target.id==='sm-comment'?'[data-action="comment-add"]':'[data-action="reply-add"]')?.click();return;}
    // Menu keys: arrows move between items, Tab leaves and closes it.
    if(state.menu&&event.target.closest?.('.sm-menu')) {
      const items=[...menuEl.querySelectorAll('[role="menuitem"]')],i=items.indexOf(event.target);
      const to={ArrowDown:i+1,ArrowUp:i-1,Home:0,End:items.length-1}[event.key];
      if(to!==undefined){event.preventDefault();items[(to+items.length)%items.length].focus();return;}
      if(event.key==='Tab'){closeMenu();return;}
    }
    if(event.key!=='Escape'||busy)return;
    if(state.menu){event.preventDefault();const id=state.menu;closeMenu();root.querySelector(`[data-key="menu-${id}"]`)?.focus();return;}
    if(state.replyTo){event.preventDefault();const id=state.replyTo;state.replyTo=null;render('reply-'+id);return;}
    if(state.drawer){event.preventDefault();render(closeDrawer());save();return;}
    if(state.editing){event.preventDefault();const id=state.editing;state.editing=null;render('menu-'+id);announce('Changes discarded.');return;}
    if(state.composingIdea){event.preventDefault();const option=state.composingIdea;state.composingIdea=null;render('compose-idea-'+option);save();announce('Draft kept for later.');return;}
    if(state.composing){event.preventDefault();state.composing=false;const id=state.open;if(ideaOf(id).versions.length===1){fold(id);return;}render('compose-'+id);save();return;}
    if(state.expanded){event.preventDefault();collapse(state.expanded);return;}
    if(state.open){event.preventDefault();fold(state.open);}
  });
  root.addEventListener('click',event=>{
    const summary=event.target.closest('.sm-source-row summary');if(!summary)return;
    const detail=summary.parentElement;
    requestAnimationFrame(()=>{state.openSources ||= {};state.openSources[detail.dataset.sourceKey]=detail.open;animateWires();save();});
  });
  restore(window.openai?.widgetState);
  render();
  window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState;if(incoming&&JSON.stringify(incoming.privateContent)!==lastSavedSnapshot){restore(incoming);render();}});
  new ResizeObserver(()=>animateWires()).observe(scene);
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>render()});tweak.addSelect(design,'type',{label:'Argument typography',options:[{label:'Graphics sans',value:'sans'},{label:'Editorial serif',value:'serif'}]});tweak.addSelect(design,'density',{label:'Card density',options:[{label:'Comfortable',value:'comfortable'},{label:'Compact',value:'compact'}]});}
})();
</script>
