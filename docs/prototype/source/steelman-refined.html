<style>

  #steelman-study .sm-column::before { content:""; position:absolute; inset:17px 0 0; border:1px solid var(--sm-line); border-radius:10px; background:var(--sm-grain) var(--sm-panel); box-shadow:var(--sm-shadow-panel); z-index:-1; }
  #steelman-study .sm-column-head { position:relative; z-index:1; display:flex; align-items:center; min-height:58px; padding:15px 18px; background:var(--sm-grain) var(--sm-card); border:1px solid var(--sm-line); border-top:2px solid var(--sm-ink); border-radius:6px; margin-bottom:28px; }

  #steelman-study .sm-menu-note { margin:4px 8px 6px; font-size:11px; color:var(--sm-muted); }

  /* Pick mode for moving a version: other rows in the option offer "Move here"; the source row recedes. */
  #steelman-study .sm-move-banner { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:12px; margin:-12px 24px 18px 40px; padding:9px 12px 9px 14px; border:1px dashed var(--sm-ink); border-radius:6px; background:var(--sm-card); font-size:13px; }

  #steelman-study .sm-move-here { position:absolute; inset:0 24px 0 0; z-index:5; display:grid; place-items:center; border:2px dashed var(--sm-ink); border-radius:10px; background:#ffffffb8; font-size:13px; font-weight:600; }
  #steelman-study .sm-open .sm-move-here { right:0; }
  #steelman-study .sm-move-here span { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--sm-ink); color:#fff; }
  #steelman-study .sm-move-here svg { width:14px; height:14px; }
  #steelman-study .sm-move-here:hover span, #steelman-study .sm-move-here:focus-visible span { box-shadow:0 0 0 3px #fff,0 0 0 5px var(--sm-ink); }
  /* Merge handle in the card footer: quiet until the card is hovered. */
  #steelman-study .sm-merge-handle { cursor:grab; }
  #steelman-study .sm-merge-handle:hover { color:var(--sm-ink); background:var(--sm-soft); }
  #steelman-study .sm-merge-handle:active { cursor:grabbing; }
  #steelman-study .sm-card:not(:hover):not(:focus-within) .sm-merge-handle { opacity:.55; }
  /* While dragging: the source recedes; targets get a dashed outline and say what dropping does. */
  #steelman-study[data-dragging] .sm-drag-source { opacity:.45; }
  #steelman-study .sm-drop-target::after { content:attr(data-drop-label); position:absolute; inset:-4px 20px -4px 36px; z-index:6; display:grid; place-items:center; border:2px dashed #8a8a8a; border-radius:12px; background:#ffffffa6; color:var(--sm-ink); font:600 13px/1 var(--sm-sans); pointer-events:none; transition:background-color var(--sm-fast) var(--sm-ease); }
  #steelman-study .sm-new-idea.sm-drop-target::after { inset:-4px 20px -4px 36px; }
  #steelman-study .sm-drop-target.sm-drop-over::after { border-style:solid; border-color:var(--sm-ink); background:#ffffffe0; }
  /* A suggested combination, under the card it would move. */
  #steelman-study .sm-suggest { position:relative; z-index:2; display:flex; align-items:center; gap:8px; margin:6px 0 0; padding:5px 6px 5px 10px; border:1px dashed #9a9a9a; border-radius:8px; background:var(--sm-card); font-size:12px; line-height:1.4; }

  /* Undo bar: where the deleted card was, in the card lane. */

  @media(prefers-reduced-motion:reduce) { #steelman-study * { transition:none !important; animation:none !important; } }

  /* ── Site header: wordmark (home), breadcrumb on a board, search on the list. ── */
  #steelman-study .sm-site { gap:14px; }
  #steelman-study .sm-wordmark { padding:0; border:0; background:none; color:var(--sm-ink); }
  #steelman-study .sm-crumbs { display:flex; align-items:center; gap:8px; min-width:0; font-size:13px; color:var(--sm-muted); }
  #steelman-study .sm-crumbs > span[aria-hidden] { color:#8a8a8a; }
  #steelman-study .sm-crumb { display:inline-flex; align-items:center; gap:7px; padding:5px 8px; margin:0 -4px; border:0; border-radius:6px; background:transparent; font-size:13px; white-space:nowrap; }
  #steelman-study .sm-crumb:hover { background:var(--sm-soft); }
  #steelman-study .sm-crumb-here { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--sm-ink); font-weight:600; }
  #steelman-study .sm-site-tools { display:flex; align-items:center; gap:10px; margin-left:auto; flex:none; }
  #steelman-study .sm-search { display:flex; align-items:center; gap:7px; width:280px; height:34px; padding:0 10px; border:1px solid var(--sm-line); border-radius:6px; background:var(--sm-panel); color:var(--sm-muted); }
  #steelman-study .sm-search:focus-within { border-color:var(--sm-ink); background:#fff; }
  #steelman-study .sm-search svg { width:15px; height:15px; }
  #steelman-study .sm-search input { flex:1; min-width:0; border:0; outline:0; background:transparent; font:400 13px var(--sm-sans); color:var(--sm-ink); }
  #steelman-study .sm-me { display:grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--sm-ink); color:#fff; font:700 11px/1 var(--sm-sans); letter-spacing:.03em; }
  /* A space is always named the same way: its name in tracked capitals, in a rounded box. */
  #steelman-study .sm-tag { display:inline-flex; align-items:center; height:21px; padding:1px 7px 0; flex:none; border:1px solid var(--sm-ink); border-radius:6px; background:#fff; color:var(--sm-ink); font:600 11px/1 var(--sm-sans); letter-spacing:.11em; text-transform:uppercase; white-space:nowrap; }
  #steelman-study .sm-nav-toggle { display:none; place-items:center; width:34px; height:34px; margin:0 -4px 0 -8px; padding:0; border:0; border-radius:6px; background:transparent; }
  #steelman-study .sm-nav-toggle:hover, #steelman-study .sm-nav-toggle[aria-expanded="true"] { background:var(--sm-soft); }
  #steelman-study .sm-nav-toggle svg { width:20px; height:20px; }

  /* ── Home: communities sidebar and the list of steelmen. ── */
  #steelman-study .sm-home { position:relative; display:grid; grid-template-columns:232px minmax(0,1fr); min-height:calc(100vh - 57px); background-color:var(--sm-list-bg); }

  /* The sidebar hangs from the site header, running the full height, inverted like the board's header boxes. */
  #steelman-study .sm-side { display:flex; flex-direction:column; align-content:start; gap:1px; padding:12px 10px 24px; background:var(--sm-ink); color:#fff; }

  #steelman-study .sm-side-link { display:flex; align-items:center; gap:10px; width:100%; min-height:36px; padding:6px 10px; border:0; border-radius:6px; background:transparent; color:#fff; font-size:13px; text-align:left; }
  #steelman-study .sm-side-link:hover { background:#ffffff1a; }
  #steelman-study .sm-side .sm-tag { background:transparent; border-color:#ffffffb3; color:#fff; }

  #steelman-study .sm-side-link.sm-side-soon { color:#ffffff8c; }

  #steelman-study .sm-feed { display:grid; gap:14px; align-content:start; width:100%; max-width:860px; min-width:0; padding:24px 32px 56px; }
  #steelman-study .sm-join { height:32px; padding:0 14px; border:1px solid var(--sm-selected); border-radius:6px; background:var(--sm-selected); color:var(--sm-on-selected); font-size:13px; font-weight:600; }
  #steelman-study .sm-join[aria-pressed="true"] { background:transparent; color:#fff; border-color:#ffffff66; }
  #steelman-study .sm-sort { display:flex; gap:3px; width:max-content; max-width:100%; overflow-x:auto; padding:3px; background:var(--sm-card); border:1px solid var(--sm-line); border-radius:6px;  }
  #steelman-study .sm-sort { padding:2px; border-radius:6px; }
  #steelman-study .sm-sort button { display:inline-flex; align-items:center; gap:5px; height:27px; padding:0 10px; border:0; border-radius:6px; background:transparent; font-size:12px; white-space:nowrap; }

  #steelman-study .sm-sort button:hover { background:var(--sm-soft); }
  #steelman-study .sm-sort button[aria-pressed="true"] { background:var(--sm-selected); color:var(--sm-on-selected); }
  #steelman-study .sm-feed-list { display:grid; gap:12px; margin:0; padding:0; list-style:none; }
  #steelman-study .sm-feed-empty { padding:40px 20px; border:1px dashed #9a9a9a; border-radius:6px; text-align:center; color:var(--sm-quiet); font:300 14px var(--sm-sans); }

  /* One steelman in the list: votes, the question, its options, activity, and a miniature of the board. */
  #steelman-study .sm-post { display:grid; grid-template-columns:40px minmax(0,1fr) 172px; gap:14px; padding:16px 18px 16px 8px; background:var(--sm-grain) var(--sm-card); border:1px solid var(--sm-line); border-radius:10px; box-shadow:var(--sm-shadow-sm); cursor:pointer;  }
  #steelman-study .sm-post:hover { border-color:#c4c4c4; box-shadow:var(--sm-shadow); }

  #steelman-study .sm-post-meta { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:12px; color:var(--sm-muted); }
  #steelman-study button.sm-tag:hover { background:var(--sm-soft); }

  #steelman-study .sm-post-meta svg { width:12px; height:12px; }
  #steelman-study .sm-post-meta .sm-dot::before { content:"·"; }
  #steelman-study .sm-post h2 { margin:7px 0 11px; font:700 20px/1.22 var(--sm-serif); letter-spacing:-.4px; text-wrap:balance; }
  #steelman-study .sm-post h2 button { padding:0; border:0; background:none; font:inherit; letter-spacing:inherit; text-align:left; }
  #steelman-study .sm-post:hover .sm-thumb { transform:translateY(-2px); box-shadow:var(--sm-shadow-sm); }
  #steelman-study .sm-post-options { display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:0; list-style:none; }
  #steelman-study .sm-post-options li { display:inline-flex; align-items:center; gap:8px; padding:3px 4px 3px 10px; border:1px solid var(--sm-line); border-radius:6px; background:#fff; font-size:12px; }
  #steelman-study .sm-post-options b { min-width:20px; padding:3px 5px; border-radius:3px; background:var(--sm-soft); font:600 11px/1 var(--sm-sans); text-align:center; font-variant-numeric:tabular-nums; }
  /* Dashed, as on the board: an option with fewer than two arguments is an invitation. */
  #steelman-study .sm-post-options li.sm-thin { border-style:dashed; border-color:#9a9a9a; }
  #steelman-study .sm-post-foot { display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px; margin-top:13px; font-size:12px; color:var(--sm-muted); }
  #steelman-study .sm-post-foot > span { display:inline-flex; align-items:center; gap:5px; }
  #steelman-study .sm-post-foot svg { width:14px; height:14px; stroke-width:1.75; }
  #steelman-study .sm-post-foot strong { font-weight:600; color:var(--sm-ink); }
  #steelman-study .sm-help { padding:2px 9px 2px 7px; border:1px dashed #8a8a8a; border-radius:999px; color:var(--sm-ink); }
  #steelman-study .sm-faces { display:inline-flex; padding-left:5px; }

  #steelman-study .sm-thumb { align-self:start; display:flex; flex-direction:column; align-items:center; gap:7px; height:116px; padding:9px 8px 0; overflow:hidden; border:1px solid var(--sm-line); border-radius:6px; background-color:var(--sm-paper); background-image:var(--sm-canvas-image); background-size:var(--sm-thumb-size); }

  // Home shows your private spaces and the communities you've joined; a space shows only its own steelmen.

  // ── New steelman: a question, two to four options, and the space it lives in ──

  const LOADED=['obviously','clearly','finally','ridiculous','stupid','just','really','still','even'];

  function accessLine(spaceId) { return `Who can see it: ${visLabel(spaceId==='none'?'private':'org',spaceId)}.`; }

    root.setAttribute('data-dragging','');
    board.querySelector(`[data-node="${from.id}"]`)?.classList.add('sm-drag-source');
    board.querySelectorAll('.sm-idea[data-node]').forEach(n=>{const i=ideaOf(n.dataset.node);if(i&&i.option===from.option&&i.id!==from.id){n.classList.add('sm-drop-target');n.dataset.dropLabel=direct?'Combine here':'Suggest combining here';}});
    if(direct&&from.versions.length>1){const slot=board.querySelector(`.sm-column[data-option="${from.option}"] .sm-new-idea`);if(slot){slot.classList.add('sm-drop-target','sm-drop-split');slot.dataset.dropLabel='Make it a separate argument';}}
    announce(direct?'Dragging. Drop it on the argument it makes the same point as.':'Dragging. Drop it on an argument to suggest combining them.');
  });
  root.addEventListener('dragover',event=>{
    if(!dragCard)return;
    const t=event.target.closest?.('.sm-drop-target');
    board.querySelectorAll('.sm-drop-over').forEach(n=>{if(n!==t)n.classList.remove('sm-drop-over');});
    if(!t)return;
    event.preventDefault();event.dataTransfer.dropEffect='move';t.classList.add('sm-drop-over');
  });
  root.addEventListener('drop',event=>{
    if(!dragCard)return;
    const t=event.target.closest?.('.sm-drop-target');if(!t)return;
    event.preventDefault();const card=dragCard,split=t.classList.contains('sm-drop-split');endDrag();
    report(split?'drag-separate':'drag-combine',{board:state.boardId,id:card});
    if(split){splitVersion(card);render('undo','reorder');save();announce('Separated into a new argument at the bottom of this option. Undo is available for ten seconds.');return;}
    const r=combine(card,t.dataset.node);render(r.focus,r.motion);save();
  });
  root.addEventListener('dragend',endDrag);
  restore(window.openai?.widgetState);
  renderView();
  window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState;if(incoming&&JSON.stringify(incoming.privateContent)!==lastSavedSnapshot){restore(incoming);renderView();}});
  new ResizeObserver(()=>animateWires()).observe(scene);
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>render()});tweak.addSelect(design,'type',{label:'Argument typography',options:[{label:'Graphics sans',value:'sans'},{label:'Editorial serif',value:'serif'}]});tweak.addSelect(design,'density',{label:'Card density',options:[{label:'Comfortable',value:'comfortable'},{label:'Compact',value:'compact'}]});}
})();
</script>
