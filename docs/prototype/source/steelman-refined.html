<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,300&display=swap');
  /* @tokens: docs/design/tokens.css is inserted here by scripts/sync-prototype.py */
  #steelman-study {
    font-family:var(--sm-sans); color:var(--sm-ink); color-scheme:light; background:transparent;
  }
  #steelman-study * { box-sizing:border-box; }

  #steelman-study .sm-logo { display:block; height:24px; width:auto; color:var(--sm-ink); flex:none; }

  #steelman-study .sm-links circle { fill:var(--sm-card); stroke:var(--sm-wire); stroke-width:1.2; }
  #steelman-study .sm-head { position:relative; z-index:1; width:86%; margin:0 auto; padding:22px 25px 24px; background:var(--sm-grain) var(--sm-card); border:1px solid var(--sm-line); border-top:3px solid var(--sm-ink); border-radius:8px; box-shadow:0 2px 3px #00000005,0 8px 18px #00000005; }

  /* Right-hand drawer: settings now, comments next. Non-modal: the board stays usable beside it. */

  #steelman-study .sm-drawer-head { position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:56px; padding:10px 12px 10px 20px; background:var(--sm-card); border-bottom:1px solid var(--sm-line); }
  #steelman-study .sm-drawer-head h2 { font:600 18px/1.3 var(--sm-serif); }

  #steelman-study .sm-choice { display:grid; grid-template-columns:16px 18px minmax(0,1fr); align-items:center; gap:2px 8px; padding:9px 11px; border:1px solid var(--sm-line); border-radius:7px; font-size:13px; cursor:pointer; }
  #steelman-study .sm-choice input { margin:0; accent-color:var(--sm-ink); }
  #steelman-study .sm-choice svg { width:15px; height:15px; color:var(--sm-muted); }

  #steelman-study .sm-choice:has(input:disabled) { opacity:.5; cursor:default; }
  #steelman-study .sm-choice:has(input:focus-visible) { outline:2px solid var(--sm-ink); outline-offset:2px; }

  #steelman-study .sm-button[data-armed] { border-color:var(--sm-cred-weak); color:var(--sm-cred-weak); }

  #steelman-study .sm-board { display:grid; grid-template-columns:minmax(0,1fr) 32px minmax(0,1fr); padding-top:56px; }

  #steelman-study .sm-board[data-open="keep"] { grid-template-columns:minmax(0,1fr) 32px minmax(0,2.6fr); }
  /* The importance axis runs down the left column's left edge, mirroring the articulation axis above an unfolded row. */
  #steelman-study .sm-column[data-option="open"] { padding-left:40px; }

  #steelman-study .sm-column-head { position:relative; z-index:1; display:flex; align-items:center; min-height:58px; padding:15px 18px; background:var(--sm-grain) var(--sm-card); border:1px solid var(--sm-line); border-top:2px solid var(--sm-ink); border-radius:7px; margin-bottom:28px; }
  /* Inverted headers: near-black boxes with white serif type for the question and the options. */

  /* Axis: hairline with swept arrowheads and light lowercase italic labels at each end. */

  /* Map-style halos: labels, line, and arrowheads knock out whatever texture sits behind them. */
  #steelman-study .sm-axis-label { font-weight:400; color:#444; text-shadow:0 0 2px var(--sm-panel),0 0 2px var(--sm-panel),0 0 3px var(--sm-panel),0 0 5px var(--sm-panel); }

  /* Unfolded row: cards on top, articulation votes on the axis beneath them. */
  #steelman-study .sm-track { display:grid; grid-template-rows:auto auto; grid-auto-flow:column; grid-auto-columns:calc((100% - 36px - 44px) / 3); gap:10px 18px; align-items:start; overflow-x:auto; overscroll-behavior-x:contain; padding:4px 14px 22px; margin:-4px -14px -18px; scrollbar-width:thin; scrollbar-color:#999 transparent; scroll-padding:2px; }

<script>
(() => {
  const root = document.getElementById('steelman-study');

  // The example document. Everything a contributor can edit lives in one saved document (state.doc),

  const seedCards = {
    access: {brief:'Sunday opening could serve people whose work overlaps the current schedule. The survey points to an unmet need.', idea:'access', claim:'Sunday hours would give some weekday workers their only practical time to visit.', yes:24, no:8, pref:26, sources:['survey','hours'], explanation:'The case is about access for people whose work overlaps the existing schedule. “Some” matters: the survey supports an unmet need among respondents, not every resident.'},
    accessBold: {brief:'The survey shows a need among some residents. It doesn’t establish access for everyone.', idea:'access', claim:'Opening on Sundays would make the library accessible to everyone who works during the week.', yes:0, no:8, pref:8, sources:['survey'], explanation:'This version is easy to read, but “everyone” goes beyond what a small, voluntary survey can establish. Sunday work, travel, and other barriers remain.'},
    accessNarrow: {brief:'This describes the survey respondents. It doesn’t tell us how common the need is across the community.', idea:'access', claim:'For 18 surveyed residents, Sunday was the only day they reported being able to visit.', yes:3, no:1, pref:4, sources:['survey'], explanation:'This version stays close to the survey result. It is precise about the sample, but leaves the reader to decide what that finding means for the wider community.'},
    study: {brief:'Students asked for quiet weekend space. The effect on learning hasn’t been measured.', idea:'study', claim:'Sunday study space could improve outcomes for students without a quiet place at home.', yes:2, no:4, pref:12, sources:['study'], explanation:'If this effect exists, it could matter a great deal. The cited material establishes a desire for study space, but does not measure learning outcomes.'},
    purpose: {brief:'This puts family access at the heart of the library’s public purpose.', idea:'purpose', claim:'A public library should be available on the day families can spend time together.', yes:0, no:0, pref:7, sources:[], explanation:'This is a judgment about what a public library ought to prioritize. It can matter to the decision without receiving a factual credibility score.'},
    staffing: {brief:'The current rota has no Sunday coverage. Reallocating duties might free up some capacity.', idea:'staffing', claim:'Sunday opening would require additional staffing unless hours are reduced elsewhere.', yes:10, no:10, pref:21, sources:['roster','budget'], explanation:'The current rota has no scheduled Sunday coverage. The disagreement is whether reallocating existing duties, without reducing opening hours, could cover the proposed shift.'},
    evenings: {brief:'Evenings could be another way to extend access. The cost comparison isn’t available to inspect.', idea:'evenings', claim:'Improving evening hours may reach more residents for the same budget.', yes:0, no:0, pref:5, sources:['unavailable'], explanation:'This is a possible alternative use of the budget. The comparison has not been reviewed, and the linked cost estimate is unavailable in this example.'},
    services: {brief:'The agreement provides cleaning and closing services for each day the building opens.', idea:'services', claim:'Sunday opening would add one more day of building services each week.', yes:18, no:0, pref:9, sources:['contract'], explanation:'The service agreement charges per open day. This is well supported in the example, though its effect on the overall decision may be small.'}
  };
  const seedSources = {
    survey: {name:'Resident access survey',locator:'Example packet · p. 2, question 4',finding:'18 of 80 respondents selected Sunday as their only available day to visit.',premise:'Some respondents cannot visit during the current opening hours.',limit:'Voluntary sample; not representative of all residents. Availability was self-reported.'},
    hours: {name:'Current opening schedule',locator:'Example packet · p. 1',finding:'The library opens Monday–Friday, 10–6, and Saturday, 10–2. It is closed on Sunday.',premise:'A Sunday session would create access at a currently unavailable time.',limit:'The schedule does not establish who would actually attend.'},
    study: {name:'Student listening session',locator:'Example packet · p. 3, notes 6–9',finding:'Seven of twelve participants asked for a quiet weekend study space.',premise:'Some students report a need for more weekend study space.',limit:'No academic outcomes were measured. A need for space does not establish an educational benefit.'},
    roster: {name:'Staff rota',locator:'Example packet · p. 4, table A',finding:'All scheduled staff hours are allocated to the current six-day week.',premise:'Sunday opening is not covered by the current rota.',limit:'A different rota or changed duties might free capacity without cutting opening hours.'},
    budget: {name:'Four-hour Sunday estimate',locator:'Example packet · p. 5, assumptions',finding:'The estimate assumes two additional staff members for four hours.',premise:'The modeled Sunday session includes extra paid staffing.',limit:'This is one staffing model. It does not prove that every viable model requires extra hours.'},
    unavailable: {name:'Evening vs. Sunday cost estimate',locator:'Example packet · attachment unavailable',unavailable:true,finding:'The cited attachment cannot be opened.',premise:'No comparison can be inspected from the available material.',limit:'An unavailable source does not show the claim is false. You can skip assessment or challenge its support.'},
    contract: {name:'Building services agreement',locator:'Example packet · p. 6, section 2',finding:'Cleaning and closing services are provided for each day the building opens.',premise:'Opening another day adds a day of services.',limit:'This does not establish the size of the additional cost or its importance.'}
  };
  const seedIdeas = [
    {id:'access',option:'open',score:42,versions:['access','accessBold','accessNarrow']},
    {id:'study',option:'open',score:31,versions:['study']},
    {id:'purpose',option:'open',score:12,versions:['purpose']},
    {id:'staffing',option:'keep',score:39,versions:['staffing']},
    {id:'evenings',option:'keep',score:25,versions:['evenings']},
    {id:'services',option:'keep',score:8,versions:['services']}

  const seedDoc = () => structuredClone({
    question:{text:'Should our library open on Sundays?',author:'Kieran LaMee',posted:'2026-11-05',org:'pod6',visibility:'org',contribute:'viewers',vote:'viewers'},

  function useDoc(next) { doc=state.doc=next; ({cards,sources,ideas}=next); }
  function validDoc(d) {

  }
  // open: idea whose versions are unfolded. expanded: card whose context and evidence are showing. drawer: right-hand panel.
  const freshState = () => ({open:null,expanded:null,composing:false,drawer:null,confirmReset:false,importance:{},preference:{},assessments:{},draftClaim:'',draftReason:'',updated:false,openSources:{},doc:null});
  let state = freshState();
  useDoc(seedDoc());
  const design = {indicator:'dossier',density:'comfortable',type:'sans'};
  function restore(raw) {
    const data = raw?.privateContent;
    if (!data || ![2,3,4].includes(data.version)) return;
    const saved = data.state || {};
    for (const key of ['importance','preference','assessments','openSources']) state[key] = saved[key] && typeof saved[key]==='object' ? saved[key] : {};
    state.updated = !!saved.updated;
    state.draftClaim = typeof saved.draftClaim==='string' ? saved.draftClaim : '';
    state.draftReason = typeof saved.draftReason==='string' ? saved.draftReason : '';
    if (data.version===4 && validDoc(saved.doc)) useDoc(saved.doc);
    else {
      // Versions 2 and 3 stored only the added versions, as an overlay on the fixed example.
      useDoc(seedDoc());
      (Array.isArray(saved.added)?saved.added:[]).slice(0,5).forEach(item=>addVersion(item?.idea,item?.claim??'',item?.reason??''));
      // Their ids were local0…local4; votes, assessments, and open sources follow each card to its new id.
      const renamed=key=>key.replace(/^local(\d)/,(_,n)=>'v'+(Number(n)+1));
      for (const key of ['preference','assessments','openSources']) state[key]=Object.fromEntries(Object.entries(state[key]).map(([k,v])=>[renamed(k),v]));
      if (typeof saved.expanded==='string') saved.expanded=renamed(saved.expanded);
    }
    // Version 2 stored a modal view; it has no meaning on the board, so it starts closed.
    if (data.version>=3) {
      state.open = ideas.some(i=>i.id===saved.open) ? saved.open : null;
      state.expanded = cards[saved.expanded] ? saved.expanded : null;
      state.composing = !!saved.composing && !!state.open;
    }
    if (['dossier','books','checklist'].includes(data.design?.indicator)) design.indicator=data.design.indicator;
    if (['comfortable','compact'].includes(data.design?.density)) design.density=data.design.density;
    if (['sans','serif'].includes(data.design?.type)) design.type=data.design.type;
  }
  let lastSavedSnapshot='';
  function save() {
    const privateContent={version:4,state:{...state,drawer:null,confirmReset:false},design};lastSavedSnapshot=JSON.stringify(privateContent);
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{prototype:'Steelman canvas cards',openIdea:state.open,expandedCard:state.expanded,design},privateContent}).catch(()=>{});
  }
  function announce(message) { status.textContent=message; }
  const optionName = option => doc.options.find(o=>o.id===option)?.name || '';
  const short = id => { const c=cards[id].claim; return c.length>60 ? c.slice(0,57)+'…' : c; };
  // Shared articulation order: the shared preference score, best first. Your own vote does not move cards.
  const ordered = idea => [...idea.versions].sort((a,b)=>cards[b].pref-cards[a].pref);
  const ideaOf = id => ideas.find(i=>i.id===id);
  const button = (action,label,extra='') => `<button type="button" class="sm-button cursor-interaction" data-action="${action}" ${extra}>${label}</button>`;
  function stats(id) { const card=cards[id],vote=state.assessments[id]; const yes=(card.yes||0)+(vote==='yes'?1:0), no=(card.no||0)+(vote==='no'?1:0); return {yes,no,n:yes+no,pct:yes+no ? Math.round(100*yes/(yes+no)):null}; }

  // A slim, swept arrowhead pointing left; CSS mirrors or rotates it for the other ends.
  const head = '<svg class="sm-axis-head" viewBox="0 0 12 8" aria-hidden="true"><path d="M11.5 .6C7 2.7 3.4 3.7 .5 4c2.9.3 6.5 1.3 11 3.4"/></svg>';
  function axis(kind,start,end) {
    return `<div class="sm-axis" data-axis="${kind}" aria-hidden="true"><span class="sm-axis-label">${start}</span><span class="sm-axis-line">${head}${head}</span><span class="sm-axis-label">${end}</span></div>`;
  }
  // One control for importance (vertical) and articulation (horizontal).
  function vote({axis:dir,action,id,value,score,group,forward,back}) {
    const btn=(v,glyph,label)=>`<button type="button" class="sm-vote-btn cursor-interaction" data-action="${action}" data-id="${id}" data-vote="${v}" data-key="${action}-${v>0?'up':'down'}-${id}" aria-pressed="${value===v}" aria-label="${label}" data-tooltip="${label}">${icon(glyph)}</button>`;
    return `<div class="sm-vote" data-axis="${dir}" role="group" aria-label="${escape(group)}">${btn(1,'chevron-up',forward)}<span class="sm-vote-score" aria-label="Net ${score}">${score}</span>${btn(-1,'chevron-down',back)}</div>`;
  }
  function importanceScore(idea) { return idea.score+(state.importance[idea.id]||0)+(state.updated&&['study','evenings'].includes(idea.id)?20:0); }
  function importanceVote(idea) {
    return vote({axis:'v',action:'importance',id:idea.id,value:state.importance[idea.id]||0,score:importanceScore(idea),group:`Importance: ${short(idea.versions[0])}`,forward:'More important if true',back:'Less important if true'});
  }
  function preferenceVote(id) {
    const value=state.preference[id]||0;
    return vote({axis:'h',action:'preference',id,value,score:cards[id].pref+value,group:`Articulation: ${short(id)}`,forward:'Better articulated',back:'Less well articulated'});
  }
  // Evidence color: red (0% supported) → neutral gray (contested) → green (supported), from the design tokens.
  const token=name=>getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const mixHex=(a,b,t)=>'#'+[1,3,5].map(i=>Math.round(parseInt(a.slice(i,i+2),16)*(1-t)+parseInt(b.slice(i,i+2),16)*t).toString(16).padStart(2,'0')).join('');
  const credColor=pct=>pct<=50?mixHex(token('--sm-cred-weak'),token('--sm-cred-mid'),pct/50):mixHex(token('--sm-cred-mid'),token('--sm-cred-strong'),(pct-50)/50);
  // Support meter: four segments, one filled per quarter of assessments that support the wording.
  // Empty segments are dashed when there are fewer than five assessments; unreviewed is an empty gray meter.
  function meter(s) {

  }
  function credibility(id) {

    return `<button ${attrs} class="sm-cred cursor-interaction" aria-label="${aria}" data-tooltip="${aria}"><span class="sm-meter">${meter(s)}</span><span class="sm-cred-copy"><span class="sm-percentage">${s.n?s.pct+'%':'Unreviewed'}</span>${s.n?`<span class="sm-count ${s.n<5?'sm-few':''}">· ${s.n}${s.n<5?' · few':''}</span>`:''}</span></button>`;
  }
  function sourceButton(id) { const n=cards[id].sources.length; return `<button type="button" class="sm-source-button cursor-interaction" data-action="toggle" data-id="${id}" data-key="source-${id}" aria-label="Inspect ${n} ${n===1?'source':'sources'}" data-tooltip="${n} linked ${n===1?'source':'sources'}">${icon('paperclip')} ${n}</button>`; }

  }

    if(state.open){event.preventDefault();fold(state.open);}
  });
  root.addEventListener('click',event=>{
    const summary=event.target.closest('.sm-source-row summary');if(!summary)return;
    const detail=summary.parentElement;
    requestAnimationFrame(()=>{state.openSources ||= {};state.openSources[detail.dataset.sourceKey]=detail.open;animateWires();save();});
  });
  restore(window.openai?.widgetState);
  render();
  window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState;if(incoming&&JSON.stringify(incoming.privateContent)!==lastSavedSnapshot){restore(incoming);render();}});
  new ResizeObserver(()=>animateWires()).observe(scene);
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>render()});tweak.addSelect(design,'type',{label:'Argument typography',options:[{label:'Graphics sans',value:'sans'},{label:'Editorial serif',value:'serif'}]});tweak.addSelect(design,'density',{label:'Card density',options:[{label:'Comfortable',value:'comfortable'},{label:'Compact',value:'compact'}]});}
})();
</script>
