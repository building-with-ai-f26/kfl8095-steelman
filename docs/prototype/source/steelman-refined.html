<script>
(() => {

  const cards = {
    access: {idea:'access', label:'Weekday workers', version:'Qualified', claim:'Sunday hours would give some weekday workers their only practical time to visit.', yes:24, no:8, pref:26, sources:['survey','hours'], explanation:'The case is about access for people whose work overlaps the existing schedule. “Some” matters: the survey supports an unmet need among respondents, not every resident.'},
    accessBold: {idea:'access', label:'Weekday workers', version:'Broader claim', claim:'Opening on Sundays would make the library accessible to everyone who works during the week.', yes:0, no:8, pref:8, sources:['survey'], explanation:'This version is easy to read, but “everyone” goes beyond what a small, voluntary survey can establish. Sunday work, travel, and other barriers remain.'},
    accessNarrow: {idea:'access', label:'Weekday workers', version:'More specific', claim:'For 18 surveyed residents, Sunday was the only day they reported being able to visit.', yes:3, no:1, pref:4, sources:['survey'], explanation:'This version stays close to the survey result. It is precise about the sample, but leaves the reader to decide what that finding means for the wider community.'},
    study: {idea:'study',label:'A place to learn',claim:'Sunday study space could improve outcomes for students without a quiet place at home.',yes:2,no:4,pref:12,sources:['study'],explanation:'If this effect exists, it could matter a great deal. The cited material establishes a desire for study space, but does not measure learning outcomes.'},
    purpose: {idea:'purpose',label:'Public purpose',claim:'A public library should be available on the day families can spend time together.',value:true,pref:7,sources:[],explanation:'This is a judgment about what a public library ought to prioritize. It can matter to the decision without receiving a factual credibility score.'},

  function render(focusKey, motion='') {
    root.dataset.indicator=design.indicator; root.dataset.density=design.density; root.dataset.type=design.type;
    if(!content.children.length)content.innerHTML=board();
    if(state.view!=='board'){renderModal(focusKey,motion);animateWires();return;}
    const before=new Map([...content.querySelectorAll('[data-node]')].map(el=>[el.dataset.node,el.getBoundingClientRect().top]));
    content.innerHTML=board();
    if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
    if(focusKey) root.querySelector(`[data-key="${focusKey}"]`)?.focus({preventScroll:true});
    const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(!reduced&&motion==='reorder') content.querySelectorAll('[data-node]').forEach(el=>{const from=before.get(el.dataset.node);if(from!==undefined){const delta=from-el.getBoundingClientRect().top;el.animate([{transform:`translateY(${delta}px)`},{transform:'translateY(0)'}],{duration:650,easing:'cubic-bezier(.2,.75,.2,1)'});}});
    animateWires(motion&&!reduced?700:0);
  }
  root.addEventListener('input',event=>{
    if(event.target.id==='sm-draft') state.draftClaim=event.target.value;
    if(event.target.id==='sm-reason') state.draftReason=event.target.value;
    if(state.preview && ['sm-draft','sm-reason'].includes(event.target.id)) {state.preview=false;modal.querySelector('.sm-preview')?.remove();}
  });
  root.addEventListener('submit',event=>event.preventDefault());
  root.addEventListener('click',event=>{
    const trigger=event.target.closest('button[data-action]');if(!trigger || !root.contains(trigger))return;
    const {action,id,key,vote}=trigger.dataset; let focus=key,motion='';
    if(action==='close'){closeModal();return;}
    if(action==='alternatives'||action==='evidence')rememberOrigin(trigger);
    if(action==='importance') {const old=state.importance[id]||0;state.importance[id]=old===Number(vote)?0:Number(vote);announce(state.importance[id]?'Importance vote saved. The shared row order stays in place.':'Importance vote withdrawn. The shared row order stays in place.');}
    if(action==='alternatives') {state.view='alternatives';state.idea=id;state.card=ideas.find(i=>i.id===id).versions[0];focus='expand-'+state.card;motion='fan';announce('Compare versions of one idea. Browsing does not cast a vote.');}
    if(action==='evidence') {state.view='evidence';state.card=id;state.idea=cards[id].idea;focus='expand-'+id;motion='detail';announce('Illustrative evidence packet. Opening it does not cast an assessment.');}
    if(action==='collapse') {state.view='alternatives';focus='expand-'+id;motion='collapse';announce('Card collapsed. Other versions remain in place.');}
    if(action==='back') {state.view=trigger.dataset.to;focus='close';motion='return';announce('Alternative articulations in front of the diagram.');}
    if(action==='preference') {state.preference[id]=(state.preference[id]||0)===Number(vote)?0:Number(vote);announce(state.preference[id]?'Version preference saved. The shared card order stays in place.':'Version preference withdrawn.');}
    if(action==='assess') {const value=trigger.dataset.value;state.assessments[state.card]=value==='skip'||state.assessments[state.card]===value?null:value;announce(state.assessments[state.card]?'Your one active assessment is included in the support percentage.':value==='skip'?'No active assessment. Skipping adds nothing to the denominator.':'Assessment withdrawn.');}
    if(action==='compose') {state.view='compose';state.preview=false;focus='back';announce('Your suggestion will remain in this prototype.');}
    if(action==='preview') {if(!state.draftClaim.trim()||!state.draftReason.trim()){modal.querySelector('#sm-error').textContent='Add a claim and a short explanation to preview your version.';return;}state.preview=true;focus=null;announce('Preview ready. This version has no inherited preference or credibility assessments.');}
    if(action==='add') {if(state.added.length>=5)return;state.added.push({idea:state.idea,claim:state.draftClaim.trim(),reason:state.draftReason.trim()});syncAdded();state.view='alternatives';state.draftClaim='';state.draftReason='';state.preview=false;state.card='local'+(state.added.length-1);focus='expand-'+state.card;motion='added';announce('Your version was added locally. The idea keeps its importance; the new card starts unreviewed.');}
    if(action==='reorder') {state.updated=!state.updated;motion='reorder';focus='reorder';announce(state.updated?'Example shared-order update applied. New sample importance scores move two ideas up.':'Original example order restored.');}
    render(focus,motion);save();
  });
  root.addEventListener('click',event=>{
    const summary=event.target.closest('.sm-source-row summary');if(!summary)return;
    const detail=summary.parentElement;
    requestAnimationFrame(()=>{state.openSources ||= {};state.openSources[detail.dataset.sourceKey]=detail.open;placeModal();save();});
  });
  modal.addEventListener('cancel',event=>{event.preventDefault();closeModal();});
  modal.addEventListener('click',event=>{if(event.target===modal)closeModal();});
  restore(window.openai?.widgetState);
  originId=state.idea;
  returnKey='expand-'+ideas.find(i=>i.id===state.idea).versions[0];
  render();
  window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState;if(incoming&&JSON.stringify(incoming.privateContent)!==lastSavedSnapshot){restore(incoming);originId=state.idea;render();}});
  new ResizeObserver(()=>animateWires()).observe(scene);
  new ResizeObserver(()=>{if(modal.open)placeModal();}).observe(modal);
  window.addEventListener('resize',()=>{if(modal.open)placeModal();});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>render()});tweak.addSelect(design,'type',{label:'Argument typography',options:[{label:'Graphics sans',value:'sans'},{label:'Editorial serif',value:'serif'}]});tweak.addSelect(design,'indicator',{label:'Evidence metaphor',options:[{label:'Paper dossier',value:'dossier'},{label:'Open book',value:'books'},{label:'Review checklist',value:'checklist'}]});tweak.addSelect(design,'density',{label:'Card density',options:[{label:'Comfortable',value:'comfortable'},{label:'Compact',value:'compact'}]});}
})();
</script>
