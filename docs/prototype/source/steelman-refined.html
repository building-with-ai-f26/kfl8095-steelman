    evenings: {idea:'evenings',label:'Reaching more people',claim:'Improving evening hours may reach more residents for the same budget.',yes:0,no:0,pref:5,sources:['unavailable'],explanation:'This is a possible alternative use of the budget. The comparison has not been reviewed, and the linked cost estimate is unavailable in this example.'},
    services: {idea:'services',label:'Building operations',claim:'Sunday opening would add one more day of building services each week.',yes:18,no:0,pref:9,sources:['contract'],explanation:'The service agreement charges per open day. This is well supported in the example, though its effect on the overall decision may be small.'}

    const to=getComputedStyle(board).transform;
    const destination=originCard()?.getBoundingClientRect();
    if(animate&&!reducedMotion())board.animate([{transform:from},{transform:to}],{duration:focused?600:420,easing:'cubic-bezier(.22,.78,.18,1)'});
    animateWires(650);
    return destination;
  }
  function snapshotFace(face) {
    if(!face)return null;
    const claim=face.querySelector('.sm-claim,.sm-evidence-claim');
    const type=claim?getComputedStyle(claim):null;
    return {face:face.cloneNode(true),rect:face.getBoundingClientRect(),fontSize:type?.fontSize,lineHeight:type?.lineHeight};
  }
  function collapsedFace(id) {
    const face=document.createElement('div');
    face.innerHTML=`<div class="sm-claim-button"><span class="sm-claim">${escape(cards[id].claim)}</span></div><div class="sm-card-meta">${credibility(id,false)}${sourceButton(id)}</div>`;
    return face;
  }
  function rememberOrigin(trigger) {
    if(modal.open)return;
    returnKey=trigger.dataset.key||'';
    originId=trigger.closest('[data-node]')?.dataset.node||state.idea;
  }
  function placeModal() {
    if(!modal.open)return;
    const rootBox=root.getBoundingClientRect(),source=originCard()?.getBoundingClientRect();
    const question=root.querySelector('.sm-head').getBoundingClientRect();
    const width=Math.min(rootBox.width-32,state.view==='alternatives'?940:state.view==='evidence'?600:760);
    const top=Math.max(question.bottom+26,(source?.top||question.bottom+60)-20);
    modal.style.width=width+'px';
    modal.style.left=(rootBox.left+(rootBox.width-width)/2+window.scrollX)+'px';
    modal.style.top=(top+window.scrollY)+'px';
    const naturalBottom=content.getBoundingClientRect().bottom+24;
    const requiredBottom=top+modal.offsetHeight+30;
    scene.style.minHeight=Math.max(naturalBottom-scene.getBoundingClientRect().top,requiredBottom-scene.getBoundingClientRect().top)+'px';
  }
  function makeFlight(face, rect, z) {
    const shell=document.createElement('article');
    shell.className='sm-card sm-flight';shell.setAttribute('aria-hidden','true');shell.inert=true;
    shell.innerHTML=face.innerHTML;
    shell.querySelectorAll('[data-key],[id]').forEach(el=>{el.removeAttribute('data-key');el.removeAttribute('id');});
    const parent=modal.getBoundingClientRect();
    Object.assign(shell.style,{left:(rect.left-parent.left)+'px',top:(rect.top-parent.top)+'px',width:rect.width+'px',height:rect.height+'px',zIndex:String(z)});
    modal.appendChild(shell);return shell;
  }
  function boxKeyframe(rect,parent) {return {left:(rect.left-parent.left)+'px',top:(rect.top-parent.top)+'px',width:rect.width+'px',height:rect.height+'px'};}
  async function liftCards(startRect) {
    if(reducedMotion())return;
    opening=true;
    const source=startRect||originCard().getBoundingClientRect(),parent=modal.getBoundingClientRect();
    const versions=[...modal.querySelectorAll('.sm-version')];
    const tasks=versions.map((version,index)=>{
      const face=version.querySelector('.sm-version-face'),end=face.getBoundingClientRect();
      const start={left:source.left+index*9,top:source.top+index*4,width:source.width,height:source.height-index*4};
      const flight=makeFlight(face,start,20-index);
      version.style.visibility='hidden';
      const animation=flight.animate([boxKeyframe(start,parent),boxKeyframe(end,parent)],{duration:520+index*45,easing:'cubic-bezier(.22,.78,.18,1)',fill:'forwards'});
      return animation.finished.catch(()=>{}).then(()=>{
        version.style.visibility='';flight.remove();
        version.querySelector('.sm-preference').animate([{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'translateY(0)'}],{duration:180,easing:'ease-out'});
      });
    });
    modal.querySelectorAll('.sm-modal-chrome,.sm-add-version').forEach(el=>el.animate([{opacity:0},{opacity:1}],{duration:250,delay:180,fill:'backwards'}));
    await Promise.all(tasks);opening=false;
    if(closeQueued){closeQueued=false;closeModal();}
  }
  async function morphCard(snapshot,target,expanding) {
    if(!snapshot||!target||reducedMotion())return;
    opening=true;
    const destination=target.getBoundingClientRect(),parent=modal.getBoundingClientRect();
    const flight=makeFlight(expanding?snapshot.face:target,snapshot.rect,30);
    const finalClaim=target.querySelector('.sm-claim,.sm-evidence-claim');
    const finalType=getComputedStyle(finalClaim);
    const claim=flight.querySelector('.sm-claim');
    target.style.visibility='hidden';
    if(claim)claim.animate([{fontSize:snapshot.fontSize,lineHeight:snapshot.lineHeight},{fontSize:finalType.fontSize,lineHeight:finalType.lineHeight}],{duration:520,easing:'cubic-bezier(.22,.78,.18,1)',fill:'forwards'});
    await flight.animate([boxKeyframe(snapshot.rect,parent),boxKeyframe(destination,parent)],{duration:520,easing:'cubic-bezier(.22,.78,.18,1)',fill:'forwards'}).finished.catch(()=>{});
    target.style.visibility='';flight.remove();
    if(expanding)target.querySelectorAll('.sm-brief,.sm-evidence-group,.sm-value-note').forEach(el=>el.animate([{opacity:0,transform:'translateY(5px)'},{opacity:1,transform:'translateY(0)'}],{duration:200,easing:'ease-out'}));
    opening=false;
    if(closeQueued){closeQueued=false;closeModal();}
  }
  function fadeRow(ghost,rect) {
    if(!ghost||reducedMotion())return;
    const parent=modal.getBoundingClientRect();
    ghost.classList.add('sm-transition-ghost');ghost.inert=true;ghost.setAttribute('aria-hidden','true');
    ghost.querySelectorAll('[data-key],[id]').forEach(el=>{el.removeAttribute('data-key');el.removeAttribute('id');});
    ghost.querySelector(`[data-version="${state.card}"]`)?.style.setProperty('visibility','hidden');
    Object.assign(ghost.style,{left:(rect.left-parent.left)+'px',top:(rect.top-parent.top)+'px',width:rect.width+'px',padding:'0',border:'0',background:'transparent',boxShadow:'none'});
    modal.appendChild(ghost);
    ghost.animate([{opacity:1,transform:'translateY(0) scale(1)'},{opacity:0,transform:'translateY(12px) scale(.97)'}],{duration:340,easing:'ease-out',fill:'forwards'}).finished.catch(()=>{}).then(()=>ghost.remove());
  }
  function syncBoardIndicators() {
    ideas.forEach(idea=>{
      const node=content.querySelector(`[data-node="${idea.id}"]`);if(!node)return;
      const id=idea.versions[0];
      node.querySelector('.sm-card-meta').innerHTML=credibility(id)+sourceButton(id);
      node.querySelector('.sm-stack-button')?.setAttribute('aria-label',`Compare ${idea.versions.length} versions of this argument`);
    });
    if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
  }
  async function closeModal() {
    if(!modal.open||closing)return;
    if(opening){closeQueued=true;return;}
    closing=true;
    modal.classList.add('sm-closing');
    const source=focusCanvas(false),parent=modal.getBoundingClientRect();
    if(source&&!reducedMotion()) {
      const faces=[...modal.querySelectorAll('.sm-version-face')];
      if(faces.length) {
        const tasks=faces.map((face,index)=>{
          const start=face.getBoundingClientRect();
          const end={left:source.left+index*9,top:source.top+index*4,width:source.width,height:source.height-index*4};
          const flight=makeFlight(face,start,20-index);
          face.closest('.sm-version').style.visibility='hidden';
          return flight.animate([boxKeyframe(start,parent),boxKeyframe(end,parent)],{duration:420,easing:'cubic-bezier(.4,0,.3,1)',fill:'forwards'}).finished.catch(()=>{});
        });
        modal.querySelectorAll('.sm-modal-chrome,.sm-add-version').forEach(el=>el.animate([{opacity:1},{opacity:0}],{duration:140,fill:'forwards'}));
        await Promise.all(tasks);
      } else if(modal.querySelector('.sm-expanded-card')) {
        const panel=modal.querySelector('.sm-expanded-card'),start=panel.getBoundingClientRect();
        const flight=makeFlight(collapsedFace(state.card),start,30);
        if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
        const fromType=getComputedStyle(panel.querySelector('.sm-evidence-claim'));
        const toType=getComputedStyle(originCard().querySelector('.sm-claim'));
        flight.querySelector('.sm-claim').animate([{fontSize:fromType.fontSize,lineHeight:fromType.lineHeight},{fontSize:toType.fontSize,lineHeight:toType.lineHeight}],{duration:420,easing:'cubic-bezier(.4,0,.3,1)',fill:'forwards'});
        modal.querySelector('.sm-reading').style.visibility='hidden';
        await flight.animate([boxKeyframe(start,parent),boxKeyframe(source,parent)],{duration:420,easing:'cubic-bezier(.4,0,.3,1)',fill:'forwards'}).finished.catch(()=>{});
      } else {
        const panel=modal.querySelector('.sm-detail');const box=panel.getBoundingClientRect();
        await panel.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${source.left-box.left}px,${source.top-box.top}px) scale(${source.width/box.width},${source.height/box.height})`,opacity:.25}],{duration:350,easing:'cubic-bezier(.4,0,.3,1)',fill:'forwards'}).finished.catch(()=>{});
      }
    }
    content.querySelector('.sm-origin')?.classList.remove('sm-origin');
    syncBoardIndicators();
    modal.close();modal.innerHTML='';modal.classList.remove('sm-closing');
    scene.style.minHeight='';
    state.view='board';closing=false;
    content.querySelector(`[data-key="${returnKey}"]`)?.focus({preventScroll:true});
    announce('Cards returned to their place in the diagram.');animateWires();save();
  }
  function renderModal(focusKey,motion) {
    const wasOpen=modal.open;
    const previousView=modal.dataset.view;
    const startingCard=motion==='detail'?snapshotFace(wasOpen?modal.querySelector(`[data-version="${state.card}"] .sm-version-face`):originCard()):motion==='return'&&previousView==='evidence'?snapshotFace(modal.querySelector('.sm-expanded-card')):null;
    const oldRow=wasOpen&&previousView==='alternatives'&&motion==='detail'?modal.querySelector('.sm-detail'):null;
    const ghost=oldRow?.cloneNode(true),ghostRect=oldRow?.getBoundingClientRect();
    const startingStack=!wasOpen?originCard()?.getBoundingClientRect():null;
    modal.dataset.view=state.view;
    modal.setAttribute('aria-label',(state.view==='alternatives'?'Alternative articulations':state.view==='evidence'?'Claim and evidence':'Suggest an alternative articulation')+': '+optionName(ideas.find(i=>i.id===state.idea).option));
    modal.innerHTML=state.view==='alternatives'?alternatives():state.view==='evidence'?evidence():composer();
    if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
    if(!wasOpen){modal.showModal();focusCanvas(true,!!motion);}
    placeModal();
    content.querySelector(`[data-node="${originId}"]`)?.classList.add('sm-origin');
    (modal.querySelector(`[data-key="${focusKey}"]`)||modal.querySelector('[data-key="close"]'))?.focus({preventScroll:true});
    if(!wasOpen&&state.view==='alternatives'&&motion==='fan')liftCards(startingStack);
    else if(startingCard&&motion==='detail'){fadeRow(ghost,ghostRect);morphCard(startingCard,modal.querySelector('.sm-expanded-card'),true);}
    else if(startingCard&&motion==='return')morphCard(startingCard,modal.querySelector(`[data-version="${state.card}"] .sm-version-face`),false);
    else if(!reducedMotion()&&motion){const panel=modal.querySelector('.sm-detail');panel.style.transformOrigin='top left';panel.animate([{transform:'translateY(12px)',opacity:.6},{transform:'translateY(0)',opacity:1}],{duration:230,easing:'ease-out'});}
  }
  let wireFrame=0,wireUntil=0;
  function drawLinks() {
    const sceneBox=scene.getBoundingClientRect();
    const rect=element=>{const b=element.getBoundingClientRect();return {x:b.left-sceneBox.left,y:b.top-sceneBox.top,w:b.width,h:b.height};};
    const question=rect(root.querySelector('.sm-head'));
    const qx=question.x+question.w/2,qy=question.y+question.h;
    const line=(x1,y1,x2,y2)=>`M${x1} ${y1}L${x2} ${y2}`;
    const path=d=>`<path d="${d}"/>`;
    const port=(x,y)=>`<circle cx="${x}" cy="${y}" r="3"/>`;
    const columns=[...content.querySelectorAll('.sm-column')];
    const narrow=window.matchMedia('(max-width:640px)').matches;
    let markup=port(qx,qy);
    columns.forEach((column,index)=>{
      const head=rect(column.querySelector('.sm-column-head'));
      const hx=head.x+head.w/2,hy=head.y;
      if(narrow&&index>0) markup+=path(`M${qx} ${qy}V${qy+18}H8V${hy-17}H${hx}V${hy}`);
      else markup+=path(`M${qx} ${qy}V${qy+24}H${hx}V${hy}`);
      markup+=port(hx,hy);
      const rows=[...column.querySelectorAll('.sm-card')].map(rect);
      const spine=head.x+12;
      if(rows.length) markup+=path(line(spine,head.y+head.h,spine,Math.max(...rows.map(r=>r.y+16))));
      rows.forEach(card=>{markup+=path(line(spine,card.y+16,card.x,card.y+16))+port(card.x,card.y+16);});
    });
    links.setAttribute('viewBox',`0 0 ${sceneBox.width} ${sceneBox.height}`);
    links.innerHTML=markup;
  }
  function animateWires(duration=0) {
    wireUntil=Math.max(wireUntil,performance.now()+duration);
    if(wireFrame)return;
    const tick=()=>{drawLinks();if(performance.now()<wireUntil)wireFrame=requestAnimationFrame(tick);else wireFrame=0;};
    wireFrame=requestAnimationFrame(tick);
  }
  function render(focusKey, motion='') {
    root.dataset.indicator=design.indicator; root.dataset.density=design.density; root.dataset.type=design.type;
    if(!content.children.length)content.innerHTML=board();
    if(state.view!=='board'){renderModal(focusKey,motion);animateWires();return;}
    const before=new Map([...content.querySelectorAll('[data-node]')].map(el=>[el.dataset.node,el.getBoundingClientRect().top]));
    content.innerHTML=board();
    if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
    if(focusKey) root.querySelector(`[data-key="${focusKey}"]`)?.focus({preventScroll:true});
    const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(!reduced&&motion==='reorder') content.querySelectorAll('[data-node]').forEach(el=>{const from=before.get(el.dataset.node);if(from!==undefined){const delta=from-el.getBoundingClientRect().top;el.animate([{transform:`translateY(${delta}px)`},{transform:'translateY(0)'}],{duration:650,easing:'cubic-bezier(.2,.75,.2,1)'});}});
    animateWires(motion&&!reduced?700:0);
  }
  root.addEventListener('input',event=>{
    if(event.target.id==='sm-draft') state.draftClaim=event.target.value;
    if(event.target.id==='sm-reason') state.draftReason=event.target.value;
    if(state.preview && ['sm-draft','sm-reason'].includes(event.target.id)) {state.preview=false;modal.querySelector('.sm-preview')?.remove();}
  });
  root.addEventListener('submit',event=>event.preventDefault());
  root.addEventListener('click',event=>{
    const trigger=event.target.closest('button[data-action]');if(!trigger || !root.contains(trigger))return;
    const {action,id,key,vote}=trigger.dataset; let focus=key,motion='';
    if(action==='close'){closeModal();return;}
    if(closing||opening)return;
    if(action==='alternatives'||action==='evidence')rememberOrigin(trigger);
    if(action==='importance') {const old=state.importance[id]||0;state.importance[id]=old===Number(vote)?0:Number(vote);announce(state.importance[id]?'Importance vote saved. The shared row order stays in place.':'Importance vote withdrawn. The shared row order stays in place.');}
    if(action==='alternatives') {state.view='alternatives';state.idea=id;focus='back';motion='fan';announce('Compare versions of one idea. Browsing does not cast a vote.');}
    if(action==='evidence') {state.from=state.view==='alternatives'?'alternatives':'board';state.view='evidence';state.card=id;state.idea=cards[id].idea;state.assessOpen=false;focus='close';motion='detail';announce('Illustrative evidence packet. Opening it does not cast an assessment.');}
    if(action==='back') {state.view=trigger.dataset.to;focus='close';motion='return';announce('Alternative articulations in front of the diagram.');}
    if(action==='preference') {state.preference[id]=(state.preference[id]||0)===Number(vote)?0:Number(vote);announce(state.preference[id]?'Version preference saved. The shared card order stays in place.':'Version preference withdrawn.');}
    if(action==='assessment-toggle') {state.assessOpen=!state.assessOpen;}
    if(action==='assess') {const value=trigger.dataset.value;state.assessments[state.card]=value==='skip'||state.assessments[state.card]===value?null:value;announce(state.assessments[state.card]?'Your one active assessment is included in the support percentage.':value==='skip'?'No active assessment. Skipping adds nothing to the denominator.':'Assessment withdrawn.');}
    if(action==='compose') {state.view='compose';state.preview=false;focus='back';announce('Your suggestion will remain in this prototype.');}
    if(action==='preview') {if(!state.draftClaim.trim()||!state.draftReason.trim()){modal.querySelector('#sm-error').textContent='Add a claim and a short explanation to preview your version.';return;}state.preview=true;focus=null;announce('Preview ready. This version has no inherited preference or credibility assessments.');}
    if(action==='add') {if(state.added.length>=5)return;state.added.push({idea:state.idea,claim:state.draftClaim.trim(),reason:state.draftReason.trim()});syncAdded();state.view='alternatives';state.draftClaim='';state.draftReason='';state.preview=false;focus='back';announce('Your version was added locally. The idea keeps its importance; the new card starts unreviewed.');}
    if(action==='reorder') {state.updated=!state.updated;motion='reorder';focus='reorder';announce(state.updated?'Example shared-order update applied. New sample importance scores move two ideas up.':'Original example order restored.');}
    render(focus,motion);save();
  });
  root.addEventListener('click',event=>{
    const summary=event.target.closest('.sm-source-row summary');if(!summary)return;
    const detail=summary.parentElement;
    requestAnimationFrame(()=>{state.openSources ||= {};state.openSources[detail.dataset.sourceKey]=detail.open;placeModal();save();});
  });
  modal.addEventListener('cancel',event=>{event.preventDefault();closeModal();});
  modal.addEventListener('click',event=>{if(event.target===modal)closeModal();});
  restore(window.openai?.widgetState);
  originId=state.idea;
  render();
  window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState;if(incoming&&JSON.stringify(incoming.privateContent)!==lastSavedSnapshot){restore(incoming);originId=state.idea;render();}});
  new ResizeObserver(()=>animateWires()).observe(scene);
  window.addEventListener('resize',()=>{if(modal.open&&!opening&&!closing)placeModal();});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>render()});tweak.addSelect(design,'type',{label:'Argument typography',options:[{label:'Graphics sans',value:'sans'},{label:'Editorial serif',value:'serif'}]});tweak.addSelect(design,'indicator',{label:'Evidence metaphor',options:[{label:'Paper dossier',value:'dossier'},{label:'Open book',value:'books'},{label:'Review checklist',value:'checklist'}]});tweak.addSelect(design,'density',{label:'Card density',options:[{label:'Comfortable',value:'comfortable'},{label:'Compact',value:'compact'}]});}
})();
</script>
