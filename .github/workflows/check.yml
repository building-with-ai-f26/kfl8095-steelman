# Runs `npm run check` on every pull request: the one command a change must
# pass (plans/architecture.md §8). It runs twice, because the command has to
# work in two kinds of place:
#
# - docker:           the test database runs in Docker, as on most laptops.
# - embedded-offline: Docker is stopped and the network is cut off after
#                     `npm ci`, as in a cloud sandbox. This is the proof that
#                     the check needs nothing but `npm install`.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [docker, embedded-offline]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      - name: Check (test database in Docker)
        if: matrix.database == 'docker'
        run: npm run check
        env:
          TEST_DATABASE: docker

      - name: The local development database starts
        if: matrix.database == 'docker'
        run: |
          docker compose up --detach --wait db
          docker compose exec db psql --username steelman --dbname steelman --command "select version()"
          docker compose down --volumes

      - name: Check (Docker stopped, no network)
        if: matrix.database == 'embedded-offline'
        run: |
          sudo systemctl stop docker.socket docker.service
          # A new network namespace has only its own loopback, so nothing in
          # it can reach the internet. Postgres won't run as root, so step
          # back down to the normal user inside it.
          sudo unshare --net sh -c "ip link set lo up && exec sudo --user=$USER env PATH=\"$PATH\" sh scripts/ci-check-offline.sh"
