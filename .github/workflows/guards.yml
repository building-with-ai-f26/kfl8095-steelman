# The protected-files check (plans/architecture.md §8, "Tests an agent can't
# quietly weaken"). Lists what a pull request changes that needs the builder:
# an existing test edited, moved, deleted, or skipped, a saved screenshot
# replaced, or a change to the policy table, a merged migration, a CI
# workflow, or a plan.
#
# It answers with a commit status, "builder approval", which `main` requires:
# success when nothing is protected or the builder has added the
# `builder-approved` label after reading the list; pending until then. A
# pending required status blocks merging just as a failure does, without
# GitHub emailing about a failed run on every push (the builder, Nov 15).
# The job itself fails only when the check can't run, and then no status is
# posted, which also blocks merging. Agents never add that label (AGENTS.md
# rule 9).
name: guards

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  statuses: write

jobs:
  protected-files:
    name: protected files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, to find where the pull request branched.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
      # Node runs the TypeScript directly, and the script needs no packages.
      # It exits 0 when nothing is protected, 1 when it lists something, and
      # otherwise when it couldn't check.
      - name: List protected changes and set the builder-approval status
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'builder-approved') }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/guards/protected-files-cli.ts "origin/$BASE"
          found=$?
          set -e
          if [ "$found" -eq 0 ]; then
            state=success; description="No protected files changed."
          elif [ "$found" -ne 1 ]; then
            echo "The check couldn't run, so no status is set and the pull request stays blocked."
            exit "$found"
          elif [ "$APPROVED" = "true" ]; then
            state=success; description="The builder approved these changes (builder-approved)."
          else
            state=pending; description="Protected files changed: the builder reads the list and adds builder-approved."
          fi
          echo "$description"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="builder approval" -f description="$description" -f target_url="$RUN" > /dev/null
